					stage1: 'stage1_minimal',
					stage2: 'stage2_audit',
					stage3: 'stage3_reasoning',
					stage4: 'stage4_inherited_config'

				let codexRemoteSessionsFetchPromise = null;
				let codexRemoteSessionsLastFetchAt = 0;

				let codexRemoteSessionsLastItems = [];
				let codexRemoteSessionsLastItemsAt = 0;

				let codexBrowserListOverviewLastFetchAt = 0;
				let codexBrowserListOverviewLastPayload = null;

				function openCodexAuditDb() {
					return new Promise((resolve, reject) => {
						const request = indexedDB.open(CODEX_AUDIT_DB, CODEX_AUDIT_DB_VERSION);
						request.onerror = () => reject(request.error);
						request.onsuccess = () => resolve(request.result);
					});
				}

				async function readStoreAll(storeName) {
					const db = await openCodexAuditDb();
					return new Promise((resolve, reject) => {
						const tx = db.transaction(storeName, 'readonly');
						const store = tx.objectStore(storeName);
						const request = store.getAll();
						request.onerror = () => reject(request.error);
						request.onsuccess = () => resolve(request.result || []);
					}).finally(() => db.close());
				}

				function idbRequest(request) {
					return new Promise((resolve, reject) => {
						request.onerror = () => reject(request.error);
						request.onsuccess = () => resolve(request.result);
					});
				}

				function getCurrentConversationIdFromHash() {
					const match = String(window.location.hash || '').match(/#\/chat\/([^/?]+)/);
					return match ? decodeURIComponent(match[1]) : '';
				}

				function readWebUiConfigFromStorage() {
					const candidates = [];
					const primaryRaw = localStorage.getItem(CODEX_WEBUI_CONFIG_KEY);
					if (primaryRaw && primaryRaw[0] === '{') {
						try {
							const parsed = JSON.parse(primaryRaw);
							if (parsed && typeof parsed === 'object') {
								candidates.push(parsed);
							}
						} catch {}
					}
					for (let index = 0; index < localStorage.length; index += 1) {
						const key = localStorage.key(index);
						if (!key || key === CODEX_WEBUI_CONFIG_KEY) continue;
						const raw = localStorage.getItem(key);
						if (!raw || raw[0] !== '{') continue;
						try {
							const parsed = JSON.parse(raw);
							if (
								parsed &&
								typeof parsed === 'object' &&
								('systemMessage' in parsed || 'reasoningStrengthLevel' in parsed || 'mcpAutoAuthorizeTools' in parsed || 'temperature' in parsed || 'top_p' in parsed)
							) {
								candidates.push(parsed);
							}
						} catch {}
					}
					return candidates[0] || {};
				}

				function writeWebUiConfigValue(key, value) {
					let config = {};
					const currentRaw = localStorage.getItem(CODEX_WEBUI_CONFIG_KEY);
					if (currentRaw && currentRaw[0] === '{') {
						try {
							const parsed = JSON.parse(currentRaw);
							if (parsed && typeof parsed === 'object') {
								config = parsed;
							}
						} catch {}
					}
					config[key] = value;
					localStorage.setItem(CODEX_WEBUI_CONFIG_KEY, JSON.stringify(config));
					return config;
				}

				function isReasoningStrengthSelect(node) {
					if (!(node instanceof HTMLSelectElement)) return false;
					const labels = Array.from(node.options || []).map((option) => normalizeText(option.textContent || '').toLowerCase());
					return labels.includes('low') && labels.includes('medium') && labels.includes('high');
				}

				function ensureSkipMcpConfirmControl() {
					const reasoningSelect = Array.from(document.querySelectorAll('select')).find(isReasoningStrengthSelect);
					if (!(reasoningSelect instanceof HTMLSelectElement) || !reasoningSelect.parentElement) return;
					let chip = document.getElementById('codex-skip-mcp-confirm-chip');
					if (!chip) {
						chip = document.createElement('label');
						chip.id = 'codex-skip-mcp-confirm-chip';
						chip.style.cssText = [
							'display:flex',
							'align-items:center',
							'gap:6px',
							'height:32px',
							'padding:0 10px',
							'border-radius:999px',
							'border:1px solid rgba(120,120,120,0.28)',
							'background:rgba(255,255,255,0.92)',
							'color:inherit',
							'font-size:11px',
							'line-height:1',
							'white-space:nowrap',
							'cursor:pointer',
							'box-shadow:0 1px 4px rgba(0,0,0,0.08)'
						].join(';');
						chip.title = 'Skip MCP tool permission confirmation popups by default';
						const checkbox = document.createElement('input');
						checkbox.type = 'checkbox';
						checkbox.id = 'codex-skip-mcp-confirm-checkbox';
						checkbox.style.cssText = 'margin:0;accent-color:#111827;cursor:pointer;';
						const text = document.createElement('span');
						text.textContent = 'Skip MCP Confirm';
						chip.appendChild(checkbox);
						chip.appendChild(text);
						checkbox.addEventListener('change', () => {
							const nextValue = !!checkbox.checked;
							writeWebUiConfigValue('mcpAutoAuthorizeTools', nextValue);
							try {
								localStorage.setItem('codex.mcp.requireApproval', nextValue ? 'false' : 'true');
							} catch {}
						});
					}
					const checkbox = chip.querySelector('input[type="checkbox"]');
					if (checkbox) {
						checkbox.checked = !!readWebUiConfigFromStorage().mcpAutoAuthorizeTools;
					}
					if (chip.parentElement !== reasoningSelect.parentElement) {
						reasoningSelect.parentElement.appendChild(chip);
					} else if (reasoningSelect.nextElementSibling !== chip) {
						reasoningSelect.insertAdjacentElement('afterend', chip);
					}
				}

				function installSkipMcpConfirmFetchPatch() {
					if (window.__codexSkipMcpConfirmFetchPatched) return;
					window.__codexSkipMcpConfirmFetchPatched = true;
					const originalFetch = window.fetch.bind(window);
					window.fetch = async (input, init) => {
						try {
							if (typeof input === 'string' && init && typeof init.body === 'string' && /^post$/i.test(init.method || '')) {
								const lowerUrl = input.toLowerCase();
								const isChatCompletions = lowerUrl.includes('/v1/chat/completions');
								const isRemoteAppend = /\/v1\/remote-sessions\/[^/]+\/append-turn/.test(lowerUrl);
								if (isChatCompletions || isRemoteAppend) {
									const body = JSON.parse(init.body);
									const skipConfirm = !!readWebUiConfigFromStorage().mcpAutoAuthorizeTools;
									body.auto_authorize = skipConfirm;
									body.authorization_default = skipConfirm ? 'allow' : 'prompt';
									init = { ...init, body: JSON.stringify(body) };
								}
							}
						} catch (error) {
							console.warn('[codex skip confirm] fetch patch skipped:', error);
						}
						return originalFetch(input, init);
					};
				}

				function pickDefinedConfigValue(...values) {
					for (const value of values) {
						if (value !== undefined && value !== null && value !== '') return value;
					}
					return undefined;
				}

				function parseCustomConfigObject(raw) {
					if (!raw || typeof raw !== 'string') return {};
					try {
						const parsed = JSON.parse(raw);
						return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
					} catch {
						return {};
					}
				}

				function readConfigValue(source, ...keys) {
					for (const key of keys) {
						if (!source || typeof source !== 'object') continue;
						if (Object.prototype.hasOwnProperty.call(source, key)) {
							const value = source[key];
							if (value !== undefined && value !== null && value !== '') return value;
						}
					}
					return undefined;
				}

				function pickFields(source, keys) {
					const picked = {};
					for (const key of keys || []) {
						if (!Object.prototype.hasOwnProperty.call(source || {}, key)) continue;
						const value = source[key];
						if (value === undefined) continue;
						picked[key] = value;
					}
					return picked;
				}

				async function fetchBrowserListOverview() {
					const now = Date.now();
					if (codexBrowserListOverviewFetchPromise) {
						return codexBrowserListOverviewFetchPromise;
					}
					if (codexBrowserListOverviewLastPayload && now - codexBrowserListOverviewLastFetchAt < 4000) {
						return codexBrowserListOverviewLastPayload;
					}
					try {
						codexBrowserListOverviewLastFetchAt = now;
						codexBrowserListOverviewFetchPromise = (async () => {
							const tryPaths = ['./overview/browser-list', './browser-list-overview'];
							for (const path of tryPaths) {
								try {
									const response = await fetch(path, { method: 'GET' });
									if (!response.ok) continue;
									const payload = await response.json();
									codexBrowserListOverviewLastPayload = payload;
									return payload;
								} catch {}
							}
							return null;
						})();
						return await codexBrowserListOverviewFetchPromise;
					} finally {
						codexBrowserListOverviewFetchPromise = null;
					}
				}

				async function fetchRemoteSessions(limit = 20) {
					const now = Date.now();
					if (codexRemoteSessionsFetchPromise) {
						return codexRemoteSessionsFetchPromise;
					}
					if (now - codexRemoteSessionsLastFetchAt < 4000) {
						return [];
					}
					try {
						codexRemoteSessionsLastFetchAt = now;
						codexRemoteSessionsFetchPromise = fetch(`./v1/remote-sessions?limit=${limit}`, { method: 'GET' });
						const response = await codexRemoteSessionsFetchPromise;
						if (!response.ok) return [];
						const payload = await response.json();
						const items = Array.isArray(payload?.items)
							? payload.items
							: Array.isArray(payload?.sessions)
								? payload.sessions
								: Array.isArray(payload)
									? payload
									: [];
						if (items.length) {
							codexRemoteSessionsLastItems = items;
							codexRemoteSessionsLastItemsAt = Date.now();
						}
						return items;
					} catch {
						return [];
					} finally {
						codexRemoteSessionsFetchPromise = null;
					}
				}

						const response = await fetch(`./v1/remote-sessions/${encodeURIComponent(sessionId)}`, { method: 'GET' });
						if (!response.ok) return null;
						return await response.json();
					} catch {

				async function appendRemoteSessionTurn(sessionId, body) {
					const response = await fetch(`./v1/remote-sessions/${encodeURIComponent(sessionId)}/append-turn`, {

						body: JSON.stringify(body)

						throw new Error(text || `append-turn failed: ${response.status}`);

					return await response.json();

					const compact = {};
					for (const [key, value] of Object.entries(config || {})) {
						if (value === undefined || value === null || value === '') continue;
						if (typeof value === 'object' && !Array.isArray(value)) {

							if (Object.keys(nested).length) compact[key] = nested;
							continue;
						}
						compact[key] = value;
					}
					return compact;

				function appendOptionValues(select, values, label) {
					if (!select) return;
					const current = select.value || '';
					select.innerHTML = `<option value="">${label}</option>`;
					for (const value of values.filter(Boolean).sort()) {
						const option = document.createElement('option');
						option.value = value;
						option.textContent = value;
						select.appendChild(option);
					}
					if (values.includes(current)) select.value = current;
				}

				function remoteTurnSearchText(turn) {
					return JSON.stringify(turn || {}).toLowerCase();
				}

				function formatRemoteValue(value) {
					if (value === undefined || value === null || value === '') return '';
					if (typeof value === 'string') return value;
					try {
						return JSON.stringify(value, null, 2);
					} catch {
						return String(value);
					}
				}

				function buildRemoteMetricsSummary(source) {
					const usage = source?.raw_response?.usage || source?.response_payload?.usage || {};
					const timings = source?.raw_response?.timings || source?.response_payload?.timings || source?.timings || {};
					const totalTokens = usage.total_tokens ?? usage.completion_tokens ?? source?.completion_tokens;
					const totalSeconds =
						(typeof timings.remote_session_turn_total_ms === 'number' ? timings.remote_session_turn_total_ms / 1000 : undefined) ??
						(typeof timings.model_completion_ms === 'number' ? timings.model_completion_ms / 1000 : undefined) ??
						(typeof timings.predicted_ms === 'number' ? timings.predicted_ms / 1000 : undefined);
					const tokensPerSecond =
						(typeof timings.predicted_per_second === 'number' ? timings.predicted_per_second : undefined) ??
						(typeof source?.tokens_per_second === 'number' ? source.tokens_per_second : undefined);
					const parts = [];
					if (typeof totalTokens === 'number') parts.push(`${totalTokens} tokens`);
					if (typeof totalSeconds === 'number' && Number.isFinite(totalSeconds)) parts.push(`${totalSeconds.toFixed(totalSeconds >= 10 ? 0 : 1)}s`);
					if (typeof tokensPerSecond === 'number' && Number.isFinite(tokensPerSecond)) parts.push(`${tokensPerSecond.toFixed(2)} t/s`);
					return parts.join('   ');
				}

				function updateRemoteSessionMetrics(overlay, source) {
					const node = overlay.querySelector('.codex-remote-session-metrics');
					if (!node) return;
					node.textContent = buildRemoteMetricsSummary(source);
				}

				function isThinkingOnlyText(value) {
					const text = normalizeText(String(value || '')).toLowerCase();
					return !text ||
						text === 'thinking process:' ||
						text === 'thinking process' ||
						text === 'thought process:' ||
						text === 'thought process';
				}

				function cleanManualAppendUserText(value) {
					const text = String(value || '');
					const marker = 'User request:';
					const index = text.lastIndexOf(marker);
					return index >= 0 ? text.slice(index + marker.length).trim() : text;
				}

				function createRemoteSection(label, value, options = {}) {
					const text = formatRemoteValue(value);
					if (!text && !options.showEmpty) return null;
					const section = document.createElement('div');
					section.style.cssText = `display:flex;flex-direction:column;gap:4px;${options.align === 'right' ? 'align-items:flex-end;' : ''}`;
					const head = document.createElement('div');
					head.textContent = label;
					head.style.cssText = 'font-size:11px;opacity:0.58;text-transform:uppercase;letter-spacing:.04em;';
					const body = document.createElement('pre');
					body.textContent = text || options.emptyText || '(empty)';
					body.style.cssText = [
						'margin:0',
						'max-width:100%',
						'white-space:pre-wrap',
						'word-break:break-word',
						'border-radius:12px',
						`background:${options.background || 'rgba(255,255,255,0.08)'}`,
						`padding:${options.compact ? '7px 9px' : '10px 12px'}`,
						'font:inherit',
						'font-size:13px',
						'line-height:1.45'
					].join(';');
					section.appendChild(head);
					section.appendChild(body);
					return section;
				}

				function parseRemoteJsonLike(value) {
					if (value === null || value === undefined) return undefined;
					if (typeof value !== 'string') return value;
					const trimmed = value.trim();
					if (!trimmed) return undefined;
					if ((trimmed.startsWith('[') && trimmed.endsWith(']')) || (trimmed.startsWith('{') && trimmed.endsWith('}'))) {
						try {
							return JSON.parse(trimmed);
						} catch (_error) {
							return value;
						}
					}
					return value;
				}

				function resolveAvailableToolCount(source) {
					const classes = parseRemoteJsonLike(source?.available_tool_classes_json || source?.availableToolClasses);
					if (Array.isArray(classes)) return classes.length;
					if (source?.mounted_tool_count !== undefined) return source.mounted_tool_count;
					if (source?.mountedToolCount !== undefined) return source.mountedToolCount;
					return undefined;
				}

				function resolveSemanticPlaneCount(source, plane) {
					if (!source) return undefined;
					if (plane === 'mcp_18080') {
						if (source.mcp_18080_count !== undefined) return source.mcp_18080_count;
						if (source.mcp18080Count !== undefined) return source.mcp18080Count;
					}
					if (plane === 'semantic_8095') {
						if (source.semantic_8095_count !== undefined) return source.semantic_8095_count;
						if (source.semantic8095Count !== undefined) return source.semantic8095Count;
					}
					const catalog = parseRemoteJsonLike(source.semantic_catalog_json || source.semanticCatalogJson);
					if (!Array.isArray(catalog)) return undefined;
					return catalog.filter((entry) => entry && typeof entry === 'object' && entry.source_plane === plane).length;
				}

				function createRemoteJsonDetails(label, value, options = {}) {
					const details = document.createElement('details');
					details.open = !!options.open;
					details.style.cssText = 'font-size:12px;opacity:0.95;';
					const summary = document.createElement('summary');
					summary.textContent = label;
					summary.style.cssText = 'cursor:pointer;opacity:0.82;';
					const body = document.createElement('pre');
					body.textContent = formatRemoteValue(parseRemoteJsonLike(value)) || '(empty)';
					body.style.cssText = 'margin-top:8px;white-space:pre-wrap;word-break:break-word;border-radius:10px;background:rgba(255,255,255,0.06);padding:10px;max-height:260px;overflow:auto;';
					details.appendChild(summary);
					details.appendChild(body);
					return details;
				}

				function createRemoteSessionProjectionBlock(session) {
					const block = document.createElement('div');
					block.style.cssText = 'display:flex;flex-direction:column;gap:10px;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px;background:rgba(94,168,255,0.08);';
					const toolCount = resolveAvailableToolCount(session);
					const info = document.createElement('div');
					info.textContent = [
						session?.session_semantic_projection_ready ? 'projection:ready' : 'projection:missing',
						session?.semantic_binding_mode ? `binding:${session.semantic_binding_mode}` : '',
						session?.semantic_observability_mode ? `obs:${session.semantic_observability_mode}` : '',
						session?.semantic_catalog_count !== undefined ? `catalog:${session.semantic_catalog_count}` : '',
						toolCount !== undefined ? `tools:${toolCount}` : '',
						session?.session_semantic_projection_source ? `source:${session.session_semantic_projection_source}` : ''
					].filter(Boolean).join(' | ') || 'No semantic projection metadata.';
					info.style.cssText = 'font-size:12px;line-height:1.45;opacity:0.9;';
					block.appendChild(info);
					block.appendChild(createRemoteJsonDetails('Available tool classes', session?.available_tool_classes_json || [], { open: true }));
					block.appendChild(createRemoteJsonDetails('Semantic catalog JSON', session?.semantic_catalog_json || [], { open: false }));
					block.appendChild(createRemoteJsonDetails('Remote dialog semantic list JSON', session?.remote_dialog_semantic_list_json || [], { open: false }));
					block.appendChild(createRemoteJsonDetails('Tool availability snapshot', session?.tool_availability_snapshot || {}, { open: false }));
					return block;
				}

				function structuredRemoteTurnResult(turn) {
					return {
						direct_answer: isThinkingOnlyText(turn.direct_answer) ? '' : (turn.direct_answer || ''),
						summary: turn.summary || '',
						evidence: turn.evidence || [],
						next_action: turn.next_action || '',
						confidence: turn.confidence || '',
						authorization_default: turn.authorization_default || '',
						auto_authorize: typeof turn.auto_authorize === 'boolean' ? turn.auto_authorize : '',
						primary_intent: turn.primary_intent || '',
						result_ref: turn.result_ref || '',
						evidence_ref: turn.evidence_ref || '',
						task_id: turn.task_id || '',
						task_group_id: turn.task_group_id || '',
						timings: turn.timings || {},
						context_refs: turn.context_refs || [],
						config_source: turn.config_source || '',
						model: turn.model || '',
						reasoning_level: turn.reasoning_level || ''
					};
				}

				function renderRemoteSessionTurns(overlay, session) {
					const turnsHost = overlay.querySelector('.codex-remote-session-turns');
					const title = overlay.querySelector('.codex-remote-session-title');
					const meta = overlay.querySelector('.codex-remote-session-meta');
					const turns = Array.isArray(session?.turns) ? session.turns : [];
					overlay.codexRemoteSessionData = session;
					if (title) title.textContent = session?.title || `Remote session ${String(session?.session_id || '').slice(0, 8)}`;
					if (meta) {
						meta.textContent = [
							session?.session_id ? `session ${session.session_id}` : '',
							turns.length ? `${turns.length} turns` : '0 turns',
							session?.updated_at ? `updated ${new Date(Number(session.updated_at)).toLocaleString()}` : ''
						].filter(Boolean).join(' | ');
					}
					if (!turnsHost) return;
					turnsHost.innerHTML = '';
					turnsHost.appendChild(createRemoteSessionProjectionBlock(session));
					appendOptionValues(overlay.querySelector('.codex-remote-session-filter-purpose'), [...new Set(turns.map((turn) => turn.prompt_purpose || ''))], 'All purposes');
					appendOptionValues(overlay.querySelector('.codex-remote-session-filter-confidence'), [...new Set(turns.map((turn) => turn.confidence || ''))], 'All confidence');
					appendOptionValues(overlay.querySelector('.codex-remote-session-filter-mode'), [...new Set(turns.map((turn) => turn.write_mode || ''))], 'All modes');
					const textFilter = String(overlay.querySelector('.codex-remote-session-filter-text')?.value || '').trim().toLowerCase();
					const purposeFilter = overlay.querySelector('.codex-remote-session-filter-purpose')?.value || '';
					const confidenceFilter = overlay.querySelector('.codex-remote-session-filter-confidence')?.value || '';
					const modeFilter = overlay.querySelector('.codex-remote-session-filter-mode')?.value || '';
					const visibleTurns = turns.filter((turn) => {
						if (purposeFilter && (turn.prompt_purpose || '') !== purposeFilter) return false;
						if (confidenceFilter && (turn.confidence || '') !== confidenceFilter) return false;
						if (modeFilter && (turn.write_mode || '') !== modeFilter) return false;
						return !textFilter || remoteTurnSearchText(turn).includes(textFilter);
					});
					if (!visibleTurns.length) {
						const empty = document.createElement('div');
						empty.textContent = turns.length ? 'No turns match current filters.' : 'No turns in this remote session yet.';
						empty.style.cssText = 'opacity:0.72;font-size:13px;';
						turnsHost.appendChild(empty);
						return;
					}
					for (const turn of visibleTurns) {
						const block = document.createElement('div');
						block.style.cssText = 'display:flex;flex-direction:column;gap:10px;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px;background:rgba(255,255,255,0.035);';
						const userText = cleanManualAppendUserText(turn.user_text || turn.prompt || '');
						const rawAssistantText = turn.assistant_text || '';
						const directAnswer = isThinkingOnlyText(turn.direct_answer) ? '' : (turn.direct_answer || '');
						const summaryAnswer = isThinkingOnlyText(turn.summary) ? '' : (turn.summary || '');
						const assistantText = isThinkingOnlyText(rawAssistantText) ? '' : rawAssistantText;
						const info = document.createElement('div');
						info.textContent = [
							turn.turn_id || '',
							turn.write_mode || '',
							turn.prompt_purpose || '',
							turn.confidence || '',
							turn.source_type || turn.source_label || '',
							turn.authorization_default || '',
							turn.config_source || '',
							turn.task_id || ''
						].filter(Boolean).join(' | ');
						info.style.cssText = 'font-size:11px;opacity:0.68;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;';
						const user = createRemoteSection('用户问题', userText, { align: 'right', background: 'rgba(255,255,255,0.16)', showEmpty: true, emptyText: '(empty user text)' });
						const assistant = createRemoteSection('助手回答', assistantText || directAnswer || summaryAnswer || '', { background: 'rgba(255,255,255,0.08)', showEmpty: true, emptyText: '未生成最终回答；请查看 Full turn JSON 或重新追加更明确的问题。' });
						const structured = createRemoteSection('结构化结果', structuredRemoteTurnResult(turn), { background: 'rgba(40,120,90,0.18)' });
						const structuredDetails = document.createElement('details');
						structuredDetails.style.cssText = 'font-size:12px;opacity:0.95;';
						const structuredSummary = document.createElement('summary');
						structuredSummary.textContent = '结构化结果';
						structuredSummary.style.cssText = 'cursor:pointer;opacity:0.82;';
						structuredDetails.appendChild(structuredSummary);
						if (structured) structuredDetails.appendChild(structured);
						const raw = document.createElement('details');
						raw.style.cssText = 'font-size:12px;opacity:0.9;';
						const rawSummary = document.createElement('summary');
						rawSummary.textContent = 'Full turn JSON';
						rawSummary.style.cssText = 'cursor:pointer;opacity:0.78;';
						const rawBody = document.createElement('pre');
						rawBody.textContent = JSON.stringify(turn, null, 2);
						rawBody.style.cssText = 'white-space:pre-wrap;word-break:break-word;border-radius:10px;background:rgba(255,255,255,0.06);padding:10px;max-height:280px;overflow:auto;';
						raw.appendChild(rawSummary);
						raw.appendChild(rawBody);
						block.appendChild(info);
						if (user) block.appendChild(user);
						if (assistant) block.appendChild(assistant);
						if (structured) block.appendChild(structuredDetails);
						block.appendChild(raw);
						turnsHost.appendChild(block);
					}
					updateRemoteSessionMetrics(overlay, visibleTurns[visibleTurns.length - 1] || session);
					turnsHost.scrollTop = turnsHost.scrollHeight;
				}

				async function loadRemoteSessionModal(sessionId) {
					const overlay = ensureRemoteSessionModal();
					const status = overlay.querySelector('.codex-remote-session-status');
					const autoAuthorizeCheckbox = overlay.querySelector('#codex-remote-param-auto-authorize');
					overlay.dataset.sessionId = sessionId;
					overlay.style.display = 'flex';
					if (autoAuthorizeCheckbox instanceof HTMLInputElement) {
						autoAuthorizeCheckbox.checked = !!readWebUiConfigFromStorage().mcpAutoAuthorizeTools;
					}
					try {
						overlay.codexInheritedModelConfig = await buildInheritedModelConfig();
					} catch (error) {
						console.warn('[codex remote sessions] inherited config build failed:', error);
						overlay.codexInheritedModelConfig = { config_source: 'global_default' };
						if (status) status.textContent = 'Config inherit failed, fallback to global_default.';
					}
					try {
						updateRemoteConfigPreview(overlay);
						updateRemoteSessionParamPreview(overlay);
					} catch (error) {
						console.warn('[codex remote sessions] preview render failed:', error);
					}
					if (status) status.textContent = 'Loading...';
					const session = await fetchRemoteSession(sessionId);
					if (!session) {
						if (status) status.textContent = 'Load failed.';
						return;
					}
					renderRemoteSessionTurns(overlay, session);
					if (status) status.textContent = 'Loaded from remote_session_store.';
				}

				function remoteConversationId(sessionId) {
					return `remote-session-${sessionId}`;
				}

				async function openRemoteConversation(conversationId) {
					if (!conversationId) return;
					try {
						sessionStorage.setItem('codexPendingRemoteConversationId', conversationId);
					} catch {}
					try {
						if (window.codexConversationBridge?.open) {
							const result = await window.codexConversationBridge.open(conversationId);
							if (result?.opened) return;
						}
					} catch (error) {
						console.warn('[codex remote sessions] bridge open failed:', error);
					}
					const targetHash = `#/chat/${conversationId}`;
					const targetUrl = `${window.location.pathname}${targetHash}`;
					if (window.location.hash !== targetHash) {
						window.location.href = targetUrl;
						return;
					}
					window.location.reload();
				}

				async function getConversationBySessionId(sessionId) {
					if (!sessionId) return null;
					const db = await openCodexAuditDb();
					try {
						const tx = db.transaction(['conversations'], 'readonly');
						const store = tx.objectStore('conversations');
						const index = store.index('sessionId');
						return await idbRequest(index.get(sessionId));
					} catch {
						return null;
					} finally {
						db.close();
					}
				}

				function buildRemoteConversationName(session) {
					if (session.session_semantic_projection_ready === false) {
						return `Remote session ${String(session.session_id || '').slice(0, 8)}`;
					}
					const turns = session.turns || [];
					const lastTurn = turns[turns.length - 1] || {};
					const summaryTitle = extractDisplaySummary(lastTurn.slice_summary || lastTurn.summary || lastTurn.direct_answer || '');
					return summaryTitle || `Remote session ${String(session.session_id || '').slice(0, 8)}`;
				}

				function buildRemoteConversationNameFromListItem(item) {
					if (item.session_semantic_projection_ready === false) {
						return `Remote session ${String(item.session_id || '').slice(0, 8)}`;
					}
					const summaryTitle = extractDisplaySummary(item.current_summary || '');
					return summaryTitle || `Remote session ${String(item.session_id || '').slice(0, 8)}`;
				}

				function buildSemanticProjectionMeta(source) {
					if (!source) return '';
					const meta = [];
					const toolCount = resolveAvailableToolCount(source);
					const mcp18080Count = resolveSemanticPlaneCount(source, 'mcp_18080');
					const semantic8095Count = resolveSemanticPlaneCount(source, 'semantic_8095');
					if (source.session_semantic_projection_ready === false || source.sessionSemanticProjectionReady === false) {
						meta.push('该 session 尚未带语义投影');
					} else if (source.semantic_binding_mode || source.semanticBindingMode) {
						meta.push(`semantic:${source.semantic_binding_mode || source.semanticBindingMode}`);
					}
					if (source.semantic_observability_mode || source.semanticObservabilityMode) {
						meta.push(`obs:${source.semantic_observability_mode || source.semanticObservabilityMode}`);
					}
					if (source.semantic_catalog_count !== undefined || source.semanticCatalogCount !== undefined) {
						meta.push(`catalog:${source.semantic_catalog_count ?? source.semanticCatalogCount}`);
					}
					if (mcp18080Count !== undefined) {
						meta.push(`18080:${mcp18080Count}`);
					}
					if (semantic8095Count !== undefined) {
						meta.push(`8095:${semantic8095Count}`);
					}
					if (toolCount !== undefined) {
						meta.push(`tools:${toolCount}`);
					}
					return meta.filter(Boolean).join(' | ');
				}

				async function deleteMessagesByConversationId(conversationId) {
					const db = await openCodexAuditDb();
					try {
						const tx = db.transaction(['messages'], 'readwrite');
						const store = tx.objectStore('messages');
						const keys = await idbRequest(store.index('convId').getAllKeys(conversationId));
						for (const key of keys || []) {
							store.delete(key);
						}
						await new Promise((resolve, reject) => {
							tx.onerror = () => reject(tx.error);
							tx.oncomplete = () => resolve();
						});
					} finally {
						db.close();
					}
				}

				async function mirrorRemoteSessionToAuditDb(session) {
					if (!session || !session.session_id) return null;
					const existingConversation = await getConversationBySessionId(session.session_id).catch(() => null);
					const conversationId = existingConversation?.id || (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : remoteConversationId(session.session_id));
					const rootId = `${conversationId}:root`;
					const turns = Array.isArray(session.turns) ? session.turns : [];
					const lastTurn = turns[turns.length - 1] || {};

					await deleteMessagesByConversationId(conversationId);

					const db = await openCodexAuditDb();
					try {
						const tx = db.transaction(['conversations', 'messages'], 'readwrite');
						const convStore = tx.objectStore('conversations');
						const msgStore = tx.objectStore('messages');

						const messages = [];
						const rootChildren = [];
						let previousMessageId = rootId;
						let currNode = rootId;

						messages.push({
							id: rootId,
							convId: conversationId,
							sessionId: session.session_id,
							type: 'root',
							timestamp: session.created_at || session.updated_at || Date.now(),
							role: 'system',
							content: '',
							parent: null,
							toolCalls: '',
							children: []
						});

						for (const turn of turns) {
							const turnId = turn.turn_id || `turn-${Date.now()}`;
							const userId = `${conversationId}:user:${turnId}`;
							const assistantId = `${conversationId}:assistant:${turnId}`;
							const taskId = turn.task_id || undefined;
							const evidenceRefs = turn.evidence_ref ? [turn.evidence_ref] : [];
							const assistantText = turn.assistant_text || turn.direct_answer || '';
							const userText = turn.user_text || turn.prompt || '';
							const turnTime = Number(turn.timestamp || session.updated_at || Date.now());
							const previousMessage = messages.find((message) => message.id === previousMessageId);
							if (previousMessage) {
								previousMessage.children = [userId];
							}
							if (previousMessageId === rootId) {
								rootChildren.push(userId);
							}

							messages.push({
								id: userId,
								convId: conversationId,
								sessionId: session.session_id,
								turnId,
								taskId,
								taskGroupId: turn.task_group_id || undefined,
								intentKey: turn.prompt_purpose || undefined,
								evidenceRefs,
								sourceType: turn.source_type || undefined,
								sourceLabel: turn.source_label || undefined,
								sourceDetail: turn.source_detail || undefined,
								handoffFrom: turn.handoff_from || undefined,
								handoffTo: turn.handoff_to || undefined,
								takeoverRelation: turn.takeover_relation || undefined,
								type: 'text',
								timestamp: turnTime,
								role: 'user',
								content: userText,
								parent: previousMessageId,
								toolCalls: '',
								children: normalizeText(assistantText) ? [assistantId] : [],
								dialogSlice: {
									sessionId: session.session_id,
									turnId,
									userText,
									assistantText,
									summary: turn.summary || undefined,
									expressionKeys: [],
									evidenceRefs,
									createdAt: turnTime
								},
								executionBinding: {
									sessionId: session.session_id,
									turnId,
									primaryIntent: turn.prompt_purpose || undefined,
									taskId,
									taskGroupId: turn.task_group_id || undefined,
									sourceType: turn.source_type || undefined,
									sourceLabel: turn.source_label || undefined,
									sourceDetail: turn.source_detail || undefined,
									handoffFrom: turn.handoff_from || undefined,
									handoffTo: turn.handoff_to || undefined,
									takeoverRelation: turn.takeover_relation || undefined,
									evidenceRefs,
									status: turn.confidence,
									toolName: turn.prompt_purpose || undefined
								}
							});

							previousMessageId = userId;
							currNode = userId;

							if (normalizeText(assistantText)) {
								messages.push({
									id: assistantId,
									convId: conversationId,
									sessionId: session.session_id,
									turnId,
									taskId,
									taskGroupId: turn.task_group_id || undefined,
									intentKey: turn.prompt_purpose || undefined,
									evidenceRefs,
									sourceType: turn.source_type || undefined,
									sourceLabel: turn.source_label || undefined,
									sourceDetail: turn.source_detail || undefined,
									handoffFrom: turn.handoff_from || undefined,
									handoffTo: turn.handoff_to || undefined,
									takeoverRelation: turn.takeover_relation || undefined,
									type: 'text',
									timestamp: turnTime + 1,
									role: 'assistant',
									content: assistantText,
									parent: userId,
									toolCalls: '',
									children: [],
									structuredConclusion: {
										task_state: '',
										reasoning_level: turn.reasoning_level || undefined,
										primary_intent: turn.prompt_purpose || undefined,
										evidence_refs: evidenceRefs,
										next_action: turn.next_action || undefined,
										session_id: session.session_id,
										turn_id: turnId,
										summary: turn.summary || turn.direct_answer || undefined
									},
									dialogSlice: {
										sessionId: session.session_id,
										turnId,
										userText,
										assistantText,
										summary: turn.summary || undefined,
										expressionKeys: [],
										evidenceRefs,
										createdAt: turnTime + 1
									},
									executionBinding: {
										sessionId: session.session_id,
										turnId,
										primaryIntent: turn.prompt_purpose || undefined,
										taskId,
										taskGroupId: turn.task_group_id || undefined,
										sourceType: turn.source_type || undefined,
										sourceLabel: turn.source_label || undefined,
										sourceDetail: turn.source_detail || undefined,
										handoffFrom: turn.handoff_from || undefined,
										handoffTo: turn.handoff_to || undefined,
										takeoverRelation: turn.takeover_relation || undefined,
										evidenceRefs,
										status: turn.confidence,
										toolName: turn.prompt_purpose || undefined
									}
								});
								currNode = assistantId;
								previousMessageId = assistantId;
							}
						}

						messages[0].children = rootChildren;
						for (const message of messages) {
							msgStore.put(message);
						}

						convStore.put({
							id: conversationId,
							name: buildRemoteConversationName(session),
							lastModified: session.updated_at || Date.now(),
							currNode: currNode === rootId ? '' : currNode,
							sessionId: session.session_id,
							lastTurnId: session.last_turn_id || lastTurn.turn_id,
							currentTaskState: lastTurn ? (lastTurn.write_mode === 'append' ? 'verify' : 'observe') : undefined,
							currentReasoningLevel: lastTurn.reasoning_level || undefined,
							currentPrimaryIntent: lastTurn.prompt_purpose || undefined,
							currentSummary: lastTurn.summary || lastTurn.direct_answer || undefined,
							sessionSemanticProjectionReady: session.session_semantic_projection_ready ?? false,
							sessionSemanticProjectionSource: session.session_semantic_projection_source || 'none',
							semanticBindingMode: session.semantic_binding_mode || 'unspecified',
							semanticObservabilityMode: session.semantic_observability_mode || 'unspecified',
							semanticCatalogCount: session.semantic_catalog_count ?? 0,
							mcp18080Count: session.mcp_18080_count ?? 0,
							semantic8095Count: session.semantic_8095_count ?? 0,
							remoteDialogSemanticListCount: session.remote_dialog_semantic_list_count ?? 0,
							callableSemanticCount: session.callable_semantic_count ?? 0,
							nonCallableSemanticCount: session.non_callable_semantic_count ?? 0,
							mountedToolCount: session.mounted_tool_count ?? 0,
							displayProjectionMode: session.display_projection_mode || 'summary_with_semantics',
							allCatalogEntriesVisibleInDialogList: session.all_catalog_entries_visible_in_dialog_list ?? false,
							catalogIsSingleSourceOfTruth: session.catalog_is_single_source_of_truth ?? false,
							availableToolClasses: Array.isArray(parseRemoteJsonLike(session.available_tool_classes_json))
								? parseRemoteJsonLike(session.available_tool_classes_json)
								: [],
							semanticCatalogJson: parseRemoteJsonLike(session.semantic_catalog_json) || [],
							lastTaskId: lastTurn.task_id || undefined,
							currentTaskGroupId: session.task_group_id || lastTurn.task_group_id || undefined,
							lastEvidenceRefs: lastTurn.evidence_ref ? [lastTurn.evidence_ref] : [],
							currentExpressionKeys: [],
							currentSourceType: session.source_type || lastTurn.source_type || undefined,
							currentSourceLabel: lastTurn.source_label || session.source_type || undefined,
							currentSourceDetail: lastTurn.source_detail || undefined,
							currentHandoffFrom: session.handoff_from || lastTurn.handoff_from || undefined,
							currentHandoffTo: session.handoff_to || lastTurn.handoff_to || undefined,
							currentTakeoverRelation: session.takeover_relation || lastTurn.takeover_relation || undefined
						});

						await new Promise((resolve, reject) => {
							tx.onerror = () => reject(tx.error);
							tx.oncomplete = () => resolve();
						});
						return conversationId;
					} finally {
						db.close();
					}
				}

				async function syncRemoteSessionsToAuditDb(limit = 20) {
					const remoteSessions = await fetchRemoteSessions(limit);
					for (const item of remoteSessions) {
						const sessionId = item.session_id || item.sessionId;
						if (!sessionId) continue;
						const full = item.turns ? item : await fetchRemoteSession(sessionId);
						if (full && full.session_id) {
							await mirrorRemoteSessionToAuditDb(full);
						}
					}
				}

				function extractResultLabel(value) {
					const text = normalizeText(value);
					if (!text) return '';
					if (/\b(PASS|SUCCESS|SUCCEEDED)\b|通过|成功/.test(text)) return 'PASS';
					if (/\b(FAIL|FAILED|ERROR)\b|失败|错误/.test(text)) return 'FAIL';
					if (/\bBLOCKED\b|阻塞/.test(text)) return 'BLOCKED';
					if (/\bOK\b|正常|可用|就绪/.test(text)) return 'OK';
					return '';
				}

				function extractDisplaySummary(value) {
					const lines = String(value || '')
						.split(/\r?\n/)
						.map((line) => line.replace(/^[>\-\*\u2022]+\s*/, '').replace(/^\d+\.\s*/, '').trim())
						.filter(Boolean)
						.filter((line) => !/^```/.test(line))
						.filter((line) => !/^state\s+/i.test(line));
					const preferred =
						lines.find((line) => /\b(PASS|FAIL|FAILED|BLOCKED|OK|SUCCESS|ERROR)\b|通过|成功|失败|错误|正常|建议/.test(line)) ||
						lines.find((line) => line.length >= 8) ||
						lines[0] ||
						'';
					const compact = normalizeText(
						preferred
							.replace(/\b(PASS|FAIL|FAILED|BLOCKED|OK|SUCCESS|ERROR)\b[: ]*/gi, '')
							.replace(/^(整体状态|操作结果|总结状态|总结|摘要)[:：]\s*/i, '')
					);
					return compact.length > 46 ? `${compact.slice(0, 46)}...` : compact;
				}

				function buildConversationMeta(conversation, latestAssistantMessage) {
					const structuredConclusion = latestAssistantMessage?.structuredConclusion || {};
					const sourceSummary =
						structuredConclusion.summary ||
						conversation.currentSummary ||
						latestAssistantMessage?.content ||
						'';
					const resultLabel = extractResultLabel(sourceSummary);
					const sourceLabel = conversation.currentSourceLabel || conversation.currentSourceType || '';
					const taskState = structuredConclusion.task_state || conversation.currentTaskState || '';
					const primaryIntent =
						(structuredConclusion.primary_intent &&
						 structuredConclusion.primary_intent !== 'unresolved'
							? structuredConclusion.primary_intent
							: conversation.currentPrimaryIntent && conversation.currentPrimaryIntent !== 'unresolved'
								? conversation.currentPrimaryIntent
								: '') || '';
					const taskId = latestAssistantMessage?.taskId || conversation.lastTaskId || '';
					const taskGroupId = conversation.currentTaskGroupId || latestAssistantMessage?.taskGroupId || '';
					const takeoverRelation = conversation.currentTakeoverRelation || latestAssistantMessage?.takeoverRelation || '';
					const handoffText = [conversation.currentHandoffFrom, conversation.currentHandoffTo].filter(Boolean).join('→');
					const sessionLabel = conversation.sessionId ? `session ${conversation.sessionId.slice(0, 8)}` : '';
					const summary = extractDisplaySummary(sourceSummary);
					const semanticProjectionMeta = buildSemanticProjectionMeta(conversation);
					return [
						resultLabel,
						sourceLabel,
						taskState,
						semanticProjectionMeta,
						primaryIntent,
						takeoverRelation,
						taskGroupId,
						handoffText,
						taskId,
						sessionLabel,
						summary
					].filter(Boolean).join(' | ');
				}

				function normalizeText(value) {
					return (value || '').replace(/\s+/g, ' ').trim();
				}

				function normalizeSidebarHeadingText(value) {
					return normalizeText(value).replace(/^[>v]\s+/, '');
				}

				function isConversationSectionHeading(node) {
					const text = normalizeSidebarHeadingText(node?.textContent || '');
					return text === 'Conversations' || text === 'Search results';
				}

				function findConversationSectionLabel() {
					const preferred = Array.from(
						document.querySelectorAll('[data-sidebar="group-label"], [data-slot="sidebar-group-label"]')
					).find((node) => isConversationSectionHeading(node));
					if (preferred) return preferred;
					return Array.from(document.querySelectorAll('*')).find((node) => isConversationSectionHeading(node));
				}

				async function listAuditConversations() {
					const conversations = await readStoreAll('conversations');
					return conversations.sort((a, b) => (b.lastModified || 0) - (a.lastModified || 0));
				}

				async function listAuditMessages() {
					const messages = await readStoreAll('messages');
					return messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
				}

				async function getConversationBySessionId(sessionId) {
					const conversations = await listAuditConversations();
					return conversations.find((conversation) => conversation.sessionId === sessionId) || null;
				}

				async function getMessagesBySessionId(sessionId) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.sessionId === sessionId);
				}

				async function getMessagesByTaskId(taskId) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.taskId === taskId);
				}

				async function getMessagesByIntentKey(intentKey) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.intentKey === intentKey);
				}

				async function getMessagesByConversationId(conversationId) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.convId === conversationId);
				}

				async function summarizeSession(sessionId) {
					const conversation = await getConversationBySessionId(sessionId);
					const messages = await getMessagesBySessionId(sessionId);
					if (!conversation) return null;
					return {
						sessionId,
						conversationId: conversation.id,
						name: conversation.name,
						taskState: conversation.currentTaskState || '',
						reasoningLevel: conversation.currentReasoningLevel || '',
						primaryIntent: conversation.currentPrimaryIntent || '',
						summary: conversation.currentSummary || '',
						lastTaskId: conversation.lastTaskId || '',
						lastEvidenceRefs: conversation.lastEvidenceRefs || [],
						messageCount: messages.length
					};
				}

				function getActiveConversationIdFromHash() {
					const match = window.location.hash.match(/^#\/chat\/([^/?#]+)/);
					return match ? match[1] : '';
				}

				async function summarizeActiveConversation() {
					const conversationId = getActiveConversationIdFromHash();
					if (!conversationId) return null;
					const conversations = await listAuditConversations();
					const conversation = conversations.find((item) => item.id === conversationId);
					if (!conversation) return null;
					const messages = await getMessagesByConversationId(conversationId);
					return {
						conversationId: conversation.id,
						sessionId: conversation.sessionId || '',
						name: conversation.name || '',
						taskState: conversation.currentTaskState || '',
						reasoningLevel: conversation.currentReasoningLevel || '',
						primaryIntent: conversation.currentPrimaryIntent || '',
						lastTaskId: conversation.lastTaskId || '',
						lastEvidenceRefs: conversation.lastEvidenceRefs || [],
						currentSummary: conversation.currentSummary || '',
						messageCount: messages.length
					};
				}

				function ensureAuditSummaryPanel() {
					let panel = document.getElementById('codex-audit-summary-panel');
					if (panel) return panel;
					panel = document.createElement('div');
					panel.id = 'codex-audit-summary-panel';
					panel.style.cssText = [
						'margin: 8px 0 12px 0',
						'padding: 8px 10px',
						'border: 1px solid rgba(255,255,255,0.12)',
						'border-radius: 10px',
						'background: rgba(255,255,255,0.03)',
						'font-size: 12px',
						'line-height: 1.45',
						'white-space: pre-wrap',
						'color: rgba(255,255,255,0.82)'
					].join(';');
					const sidebarLabel = findConversationSectionLabel();
					if (!sidebarLabel || !sidebarLabel.parentElement) return panel;
					const anchor = sidebarLabel.parentElement.parentElement;
					if (anchor) {
						anchor.insertBefore(panel, sidebarLabel.parentElement.nextSibling);
					}
					return panel;
				}

				async function renderAuditSummaryPanel() {
					const panel = ensureAuditSummaryPanel();
					if (!panel || !panel.parentElement) return;
					const summary = await summarizeActiveConversation();
					if (!summary) {
						panel.textContent = 'Audit summary: no active conversation binding detected yet.';
						return;
					}
					panel.textContent = [
						'Audit summary',
						`session: ${summary.sessionId || '(empty)'}`,
						`task_state: ${summary.taskState || '(empty)'}`,
						`reasoning: ${summary.reasoningLevel || '(empty)'}`,
						`intent: ${summary.primaryIntent || '(empty)'}`,
						`task_id: ${summary.lastTaskId || '(empty)'}`,
						`messages: ${summary.messageCount}`,
						`summary: ${summary.currentSummary || '(empty)'}`
					].join('\n');
				}

				function buildMessageAuditText(message) {
					const structuredConclusion = message.structuredConclusion || {};
					const parts = [
						`session ${message.sessionId || structuredConclusion.session_id || '(empty)'}`,
						`turn ${message.turnId || structuredConclusion.turn_id || '(empty)'}`,
						`intent ${message.intentKey || structuredConclusion.primary_intent || '(empty)'}`,
						`task ${message.taskId || '(empty)'}`
					];
					return parts.join(' | ');
				}

				function buildConversationAuditText(summary) {
					if (!summary) return 'session (pending) | turn (pending) | intent (pending) | task (pending)';
					return [
						`session ${summary.sessionId || '(empty)'}`,
						'turn (latest)',
						`intent ${summary.primaryIntent || '(empty)'}`,
						`task ${summary.lastTaskId || '(empty)'}`
					].join(' | ');
				}

				function findMessageStatisticsRows() {
					return Array.from(document.querySelectorAll('div')).filter((node) => {
						const text = normalizeText(node.textContent || '');
						if (!text) return false;
						const hasTokenStat = /\b\d+\s+tokens\b/i.test(text);
						const hasTimeStat = /\b\d+(\.\d+)?s\b/.test(text);
						const hasRateStat = /\b\d+(\.\d+)?\s*\/s\b/i.test(text);
						const isPendingAuditLine = text.includes('session (pending)') || text.includes('turn (pending)');
						const isAuditLine = node.classList?.contains('codex-audit-message-line');
						return !isPendingAuditLine && !isAuditLine && hasTokenStat && (hasTimeStat || hasRateStat);
					});
				}

				function ensureMessageAuditChip(row) {
					let chip = row.querySelector('.codex-audit-message-chip');
					if (!chip) {
						const previous = row.previousElementSibling;
						if (previous && previous.classList?.contains('codex-audit-message-chip')) {
							chip = previous;
						}
					}
					if (!chip) {
						chip = document.createElement('span');
						chip.className = 'codex-audit-message-chip';
						chip.style.cssText = [
							'display: inline-flex',
							'align-items: center',
							'margin-left: 12px',
							'padding: 2px 8px',
							'border: 1px solid rgba(255,255,255,0.12)',
							'border-radius: 999px',
							'font-size: 11px',
							'line-height: 1.2',
							'color: rgba(255,255,255,0.7)',
							'background: rgba(255,255,255,0.04)',
							'white-space: nowrap'
						].join(';');
						row.insertAdjacentElement('afterbegin', chip);
					} else if (chip.parentElement !== row) {
						row.insertAdjacentElement('afterbegin', chip);
					} else if (row.firstElementChild !== chip) {
						row.insertAdjacentElement('afterbegin', chip);
					}
					return chip;
				}

				function cleanupMessageAuditChips(statRows) {
					const validRows = new Set(statRows);
					Array.from(document.querySelectorAll('.codex-audit-message-chip')).forEach((chip) => {
						const parent = chip.parentElement;
						if (!parent || !validRows.has(parent)) {
							chip.remove();
						}
					});
				}

				async function decorateMessageStatistics() {
					const conversationId = getActiveConversationIdFromHash();
					if (!conversationId) return;
					const statRows = findMessageStatisticsRows();
					if (!statRows.length) return;
					cleanupMessageAuditChips(statRows);
					const allMessages = await getMessagesByConversationId(conversationId);
					const assistantMessages = allMessages
						.filter((message) => message.role === 'assistant' && message.type !== 'root')
						.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
					const conversationSummary = await summarizeActiveConversation();
					const row = statRows[statRows.length - 1];
					if (!row) return;
					const lastAssistantMessage = assistantMessages[assistantMessages.length - 1];
					const auditChip = ensureMessageAuditChip(row);
					if (!auditChip) return;
					auditChip.textContent = lastAssistantMessage
						? buildMessageAuditText(lastAssistantMessage)
						: buildConversationAuditText(conversationSummary);
				}

				function findSidebarConversationButtons() {
					const sidebarLabel = findConversationSectionLabel();
					if (!sidebarLabel) return [];
					let container = sidebarLabel.parentElement;
					for (let i = 0; i < 6 && container; i += 1) {
						const buttons = Array.from(container.querySelectorAll('button')).filter((button) => {
							const text = normalizeText(button.innerText || button.textContent || '');
							return !!text && text !== 'New chat' && text !== 'Search' && !text.includes('MCP Servers');
						});
						if (buttons.length >= 1) return buttons;
						container = container.parentElement;
					}
					return [];
				}

				function findSidebarConversationContainer() {
					const buttons = findSidebarConversationButtons();
					if (!buttons.length) return null;
					return buttons[0].parentElement;
				}

				const CODEX_SIDEBAR_SECTION_STATE_KEY = 'codex.sidebar.section.state';
				const CODEX_SIDEBAR_SECTION_STATE_VERSION_KEY = 'codex.sidebar.section.state.version';
				const CODEX_SIDEBAR_SECTION_STATE_VERSION = 'browser-list-overview-v3';
				let codexSidebarSectionStateMigrated = false;

				function migrateSidebarSectionStateOnce() {
					if (codexSidebarSectionStateMigrated) return;
					codexSidebarSectionStateMigrated = true;
					try {
						const currentVersion = localStorage.getItem(CODEX_SIDEBAR_SECTION_STATE_VERSION_KEY);
						if (currentVersion === CODEX_SIDEBAR_SECTION_STATE_VERSION) return;
						localStorage.removeItem(CODEX_SIDEBAR_SECTION_STATE_KEY);
						localStorage.setItem(CODEX_SIDEBAR_SECTION_STATE_VERSION_KEY, CODEX_SIDEBAR_SECTION_STATE_VERSION);
					} catch {}
				}

				function readSidebarSectionState() {
					try {
						migrateSidebarSectionStateOnce();
						const raw = localStorage.getItem(CODEX_SIDEBAR_SECTION_STATE_KEY);
						if (!raw) return {};
						const parsed = JSON.parse(raw);
						return parsed && typeof parsed === 'object' ? parsed : {};
					} catch {
						return {};
					}
				}

				function writeSidebarSectionState(nextState) {
					try {
						migrateSidebarSectionStateOnce();
						localStorage.setItem(CODEX_SIDEBAR_SECTION_STATE_KEY, JSON.stringify(nextState || {}));
					} catch {}
				}

				function isSidebarSectionCollapsed(sectionId) {
					const state = readSidebarSectionState();
					return !!state[sectionId];
				}

				function setSidebarSectionCollapsed(sectionId, collapsed) {

					state[sectionId] = !!collapsed;

					chevron.className = 'codex-sidebar-section-chevron';
					chevron.setAttribute('aria-hidden', 'true');
					chevron.style.cssText = [

					].join(';');
					toggle.insertBefore(chevron, toggle.firstChild);
					return chevron;
				}

				function applySidebarSectionCollapsed(sectionId, toggle, body) {
					if (!toggle || !body) return;
					const collapsed = isSidebarSectionCollapsed(sectionId);
					const chevron = ensureSectionChevron(toggle);
					body.style.display = collapsed ? 'none' : '';
					toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
					chevron.textContent = collapsed ? '>' : 'v';
				}

				function ensureSidebarSectionToggle(sectionId, toggle, body) {
					if (!toggle || !body) return;
					toggle.style.cursor = 'pointer';
					toggle.style.userSelect = 'none';
					if (!toggle.dataset.codexSidebarSectionToggleBound) {
						toggle.dataset.codexSidebarSectionToggleBound = 'true';
						toggle.addEventListener('click', (event) => {
							event.preventDefault();
							event.stopPropagation();
							const nextCollapsed = !isSidebarSectionCollapsed(sectionId);
							setSidebarSectionCollapsed(sectionId, nextCollapsed);
							applySidebarSectionCollapsed(sectionId, toggle, body);
						});
					}
					applySidebarSectionCollapsed(sectionId, toggle, body);
				}

					};

				function mergeBrowserOverviewSections(incomingSections, fallbackStatus = 'unavailable') {
					const defaults = getDefaultBrowserOverviewSections(
						fallbackStatus,
						fallbackStatus === 'pending'
							? 'Waiting for browser-list overview.'
							: 'Browser-list overview did not return this section yet.'
					);
					const byId = new Map(defaults.map((card) => [card.id, card]));
					for (const card of incomingSections || []) {
						const normalized = normalizeOverviewCard(card);
						if (!normalized.id) continue;
						byId.set(normalized.id, { ...(byId.get(normalized.id) || {}), ...normalized });
					}
					const ordered = defaults.map((card) => byId.get(card.id)).filter(Boolean);
					const extras = Array.from(byId.values()).filter((card) => !defaults.some((item) => item.id === card.id));
					return [...ordered, ...extras];
				}

						if (!sectionId) continue;
						validIds.add(sectionId);
						let node = container.querySelector(`.codex-browser-overview-card[data-section-id="${sectionId}"]`);
						if (!node) {
							node = createOverviewCard(card);
							container.appendChild(node);
						} else {

						semanticCatalogCount: session.semantic_catalog_count ?? 0,
						mcp18080Count: session.mcp_18080_count ?? 0,
						semantic8095Count: session.semantic_8095_count ?? 0,
						remoteDialogSemanticListCount: session.remote_dialog_semantic_list_count ?? 0,
						callableSemanticCount: session.callable_semantic_count ?? 0,
						nonCallableSemanticCount: session.non_callable_semantic_count ?? 0,
						mountedToolCount: session.mounted_tool_count ?? 0,
						displayProjectionMode: session.display_projection_mode || 'summary_with_semantics',
						allCatalogEntriesVisibleInDialogList: session.all_catalog_entries_visible_in_dialog_list ?? false,
						catalogIsSingleSourceOfTruth: session.catalog_is_single_source_of_truth ?? false,
						availableToolClasses: Array.isArray(parseRemoteJsonLike(session.available_tool_classes_json))
							? parseRemoteJsonLike(session.available_tool_classes_json)
							: [],
						semanticCatalogJson: parseRemoteJsonLike(session.semantic_catalog_json) || [],
						lastTaskId: lastTurn.task_id || '',
						currentTaskGroupId: session.task_group_id || lastTurn.task_group_id || '',
						currentSourceType: session.source_type || lastTurn.source_type || '',
						currentSourceLabel: lastTurn.source_label || session.source_type || '',
						currentHandoffFrom: session.handoff_from || lastTurn.handoff_from || '',
						currentHandoffTo: session.handoff_to || lastTurn.handoff_to || '',
						currentTakeoverRelation: session.takeover_relation || lastTurn.takeover_relation || ''
					};
				}

				async function decorateSidebarConversationList() {
					const conversations = await listAuditConversations();
					if (!conversations.length) return;
					const allMessages = await listAuditMessages();
					const buttons = findSidebarConversationButtons();
					if (!buttons.length) return;
					const visibleConversations = conversations.slice(0, buttons.length);
					for (let index = 0; index < visibleConversations.length; index += 1) {
						const conversation = visibleConversations[index];
						const button = buttons[index];
						if (!button) continue;
						const span = button.querySelector('span');
						if (!span) continue;
						const latestAssistantMessage = allMessages
							.filter((message) => message.convId === conversation.id && message.role === 'assistant' && message.type !== 'root')
							.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))[0];
						const meta = buildConversationMeta(conversation, latestAssistantMessage);
						const nextText = meta ? `${conversation.name}\n${meta}` : conversation.name;
						if (normalizeText(span.textContent) !== normalizeText(nextText)) {
							span.textContent = nextText;
						}
						button.title = [
							meta,
							conversation.currentSummary,
							latestAssistantMessage?.taskId
						].filter(Boolean).join(' | ') || conversation.name;
						button.setAttribute(CODEX_AUDIT_SIDEBAR_MARK, 'true');
					}
				}

				async function renderRemoteConversationList() {
					const section = ensureRemoteConversationListContainer();
					if (!section) return;
					const container = section.querySelector('.codex-remote-conversation-items');
					const heading = section.querySelector('.codex-remote-conversation-heading');
					const headingLabel = section.querySelector('.codex-remote-conversation-heading-label');
					if (!container) return;
					let remoteSessions = await fetchRemoteSessions(20);
					if (!remoteSessions.length && codexRemoteSessionsLastItems.length && (Date.now() - codexRemoteSessionsLastItemsAt) < 60000) {
						remoteSessions = codexRemoteSessionsLastItems;
					}
					const validSessionIds = new Set();
					if (heading && container) {
						ensureSidebarSectionToggle('remote-sessions', heading, container);
					}
					if (headingLabel) {
						headingLabel.textContent = remoteSessions.length ? `Remote Sessions (${remoteSessions.length})` : 'Remote Sessions';
					}
					if (!remoteSessions.length) {
						Array.from(container.querySelectorAll('.codex-remote-conversation-button')).forEach((button) => button.remove());
						return;
					}
					for (const item of remoteSessions) {
						const sessionId = item.session_id || item.sessionId;
						if (!sessionId) continue;
						validSessionIds.add(sessionId);
						const conversation = buildRemoteConversationViewFromListItem(item);
						const latestAssistantMessage = normalizeText(item.current_summary || '')
							? {
								content: item.current_summary || '',
								taskId: item.last_task_id || '',
								structuredConclusion: {
									summary: item.current_summary || ''
								}
							}
							: null;
						let button = container.querySelector(`.codex-remote-conversation-button[data-session-id="${sessionId}"]`);
						if (!button) {
							button = createRemoteConversationButton(conversation, latestAssistantMessage);
							const content = button.querySelector('.codex-remote-conversation-content');
							const openButton = button.querySelector('.codex-remote-open-button');
							content?.addEventListener('click', async (event) => {
								event.preventDefault();
								event.stopPropagation();
								loadRemoteSessionModal(sessionId).catch((error) => console.warn('[codex remote sessions] modal open failed:', error));
							});
							openButton?.addEventListener('click', (event) => {
								event.preventDefault();
								event.stopPropagation();
								loadRemoteSessionModal(sessionId).catch((error) => console.warn('[codex remote sessions] modal open failed:', error));
							});
							container.appendChild(button);
						} else {
							const title = button.querySelector('.codex-remote-conversation-content > div:first-child');
							const meta = button.querySelector('.codex-remote-conversation-meta');
							const nextTitle = conversation.name || `Remote session ${String(conversation.sessionId || '').slice(0, 8)}`;
							const nextMeta = buildRemoteConversationMetaFromListItem(item);
							if (title && normalizeText(title.textContent) !== normalizeText(nextTitle)) {
								title.textContent = nextTitle;
							}
							if (meta && normalizeText(meta.textContent) !== normalizeText(nextMeta)) {
								meta.textContent = nextMeta;
							}
							button.title = [nextMeta, conversation.currentSummary, latestAssistantMessage?.taskId].filter(Boolean).join(' | ');
						}
					}
					Array.from(container.querySelectorAll('.codex-remote-conversation-button')).forEach((button) => {
						if (!validSessionIds.has(button.dataset.sessionId || '')) {
							button.remove();
						}
					});
				}

				async function renderOverviewBrowserList() {
					const section = ensureOverviewSectionContainer();
					if (!section) return;
					const container = section.querySelector('.codex-browser-overview-items');
					const heading = section.querySelector('.codex-browser-overview-heading');
					const headingLabel = section.querySelector('.codex-browser-overview-heading-label');
					if (!container) return;
					if (heading) {
						ensureSidebarSectionToggle('overview', heading, container);
					}
					renderOverviewCards(container, mergeBrowserOverviewSections([], 'pending'));
					if (headingLabel) {
						headingLabel.textContent = 'Overview (6)';
					}
					const payload = await fetchBrowserListOverview();
					const parsedSections = parseRemoteJsonLike(payload?.sections_json);
					const incomingSections = Array.isArray(parsedSections)
						? parsedSections
						: Array.isArray(payload?.sections)
							? payload.sections
							: [];
					const sections = mergeBrowserOverviewSections(
						incomingSections,
						payload ? 'unavailable' : 'failed'
					);
					if (headingLabel) {
						headingLabel.textContent = `Overview (${sections.length})`;
					}
					renderOverviewCards(container, sections);
				}

				function installAuditSidebarObserver() {
					const scheduleDecorate = () => {
						if (codexRemoteSessionsRenderQueued) return;
						codexRemoteSessionsRenderQueued = true;
						window.requestAnimationFrame(async () => {
							codexRemoteSessionsRenderQueued = false;
							ensureSkipMcpConfirmControl();
							renderOverviewBrowserList().catch(() => {});
							renderRemoteConversationList().catch(() => {});
							ensureConversationsSectionCollapsible();
							decorateSidebarConversationList().catch(() => {});
							renderAuditSummaryPanel().catch(() => {});
							decorateMessageStatistics().catch(() => {});
						});
					};
					scheduleDecorate();
					setTimeout(scheduleDecorate, 300);
					setTimeout(scheduleDecorate, 1200);
					setTimeout(scheduleDecorate, 2500);
					let bootstrapTicks = 0;
					const bootstrapTimer = setInterval(() => {
						bootstrapTicks += 1;
						scheduleDecorate();
						const section = document.getElementById('codex-remote-conversation-list');
						const buttons = section ? section.querySelectorAll('.codex-remote-conversation-button') : [];
						if (buttons.length > 0 || bootstrapTicks >= 8) {
							clearInterval(bootstrapTimer);
						}
					}, 800);
					window.addEventListener('hashchange', scheduleDecorate);
					window.addEventListener('focus', scheduleDecorate);
					window.addEventListener('resize', scheduleDecorate);
					setInterval(scheduleDecorate, 12000);
				}

				window.codexAudit = {
					openDb: openCodexAuditDb,
					listConversations: listAuditConversations,
					listMessages: listAuditMessages,
					syncRemoteSessions: syncRemoteSessionsToAuditDb,
					getConversationBySessionId,
					getMessagesBySessionId,
					getMessagesByTaskId,
					getMessagesByIntentKey,
					getMessagesByConversationId,
					summarizeSession,
					summarizeActiveConversation,
					refreshSidebar: decorateSidebarConversationList,
					refreshMessageAudit: decorateMessageStatistics
				};

				{
					__sveltekit__ = {
						base: new URL('.', location).pathname.slice(0, -1)
					};

					const element = document.currentScript.parentElement;
					installSkipMcpConfirmFetchPatch();

					import("./bundle.js?v=20260424c").then((app) => {
						app.start(element);
						ensureSkipMcpConfirmControl();
						installAuditSidebarObserver();
					});
				}
			</script>
		</div>
	</body>
</html>
