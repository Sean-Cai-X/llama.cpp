				function openCodexAuditDb() {
					return new Promise((resolve, reject) => {
						const request = indexedDB.open(CODEX_AUDIT_DB, CODEX_AUDIT_DB_VERSION);
						request.onerror = () => reject(request.error);
						request.onsuccess = () => resolve(request.result);
					});
				}

				async function readStoreAll(storeName) {
					const db = await openCodexAuditDb();
					return new Promise((resolve, reject) => {
						const tx = db.transaction(storeName, 'readonly');
						const store = tx.objectStore(storeName);
						const request = store.getAll();
						request.onerror = () => reject(request.error);
						request.onsuccess = () => resolve(request.result || []);
					}).finally(() => db.close());
				}

				function idbRequest(request) {
					return new Promise((resolve, reject) => {
						request.onerror = () => reject(request.error);
						request.onsuccess = () => resolve(request.result);
					});
				}

				function getCurrentConversationIdFromHash() {
					const match = String(window.location.hash || '').match(/#\/chat\/([^/?]+)/);
					return match ? decodeURIComponent(match[1]) : '';
				}

				function readWebUiConfigFromStorage() {
					const candidates = [];
					for (let index = 0; index < localStorage.length; index += 1) {
						const key = localStorage.key(index);
						if (!key) continue;
						const raw = localStorage.getItem(key);
						if (!raw || raw[0] !== '{') continue;
						try {
							const parsed = JSON.parse(raw);
							if (
								parsed &&
								typeof parsed === 'object' &&
								('systemMessage' in parsed || 'reasoningStrengthLevel' in parsed || 'temperature' in parsed || 'top_p' in parsed)
							) {
								candidates.push(parsed);
							}
						} catch {}
					}
					return candidates[0] || {};
				}

				function pickDefinedConfigValue(...values) {
					for (const value of values) {
						if (value !== undefined && value !== null && value !== '') return value;
					}
					return undefined;
				}

				function parseCustomConfigObject(raw) {
					if (!raw || typeof raw !== 'string') return {};
					try {
						const parsed = JSON.parse(raw);
						return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
					} catch {
						return {};
					}
				}

				function pickFields(source, keys) {
					const picked = {};
					for (const key of keys || []) {
						if (!Object.prototype.hasOwnProperty.call(source || {}, key)) continue;
						const value = source[key];
						if (value === undefined) continue;
						picked[key] = value;
					}
					return picked;
				}

				async function fetchRemoteSessions(limit = 20) {
					const now = Date.now();
					if (codexRemoteSessionsFetchPromise) {
						return codexRemoteSessionsFetchPromise;
					}
					if (now - codexRemoteSessionsLastFetchAt < 4000) {
						return [];
					}
					try {
						codexRemoteSessionsLastFetchAt = now;
						codexRemoteSessionsFetchPromise = fetch(`./v1/remote-sessions?limit=${limit}`, { method: 'GET' });
						const response = await codexRemoteSessionsFetchPromise;
						if (!response.ok) return [];
						const payload = await response.json();
						const items = Array.isArray(payload?.items)
							? payload.items
							: Array.isArray(payload?.sessions)
								? payload.sessions
								: Array.isArray(payload)
									? payload
									: [];
						if (items.length) {
							codexRemoteSessionsLastItems = items;
							codexRemoteSessionsLastItemsAt = Date.now();
						}
						return items;
					} catch {
						return [];
					} finally {
						codexRemoteSessionsFetchPromise = null;
					}
				}

				async function fetchRemoteSession(sessionId) {
					try {
						const response = await fetch(`./v1/remote-sessions/${encodeURIComponent(sessionId)}`, { method: 'GET' });
						if (!response.ok) return null;
						return await response.json();
					} catch {
						return null;
					}
				}

				async function appendRemoteSessionTurn(sessionId, body) {
					const response = await fetch(`./v1/remote-sessions/${encodeURIComponent(sessionId)}/append-turn`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(body)
					});
					if (!response.ok) {
						const text = await response.text().catch(() => '');
						throw new Error(text || `append-turn failed: ${response.status}`);
					}
					return await response.json();
				}

				function compactInheritedModelConfig(config) {
					const compact = {};
					for (const [key, value] of Object.entries(config || {})) {
						if (value === undefined || value === null || value === '') continue;
						if (typeof value === 'object' && !Array.isArray(value)) {
							const nested = compactInheritedModelConfig(value);
							if (Object.keys(nested).length) compact[key] = nested;
							continue;
						}
						compact[key] = value;
					}
					return compact;
				}

				function buildFrozenInheritedConfig(config) {
					return compactInheritedModelConfig(pickFields(config || {}, CODEX_REMOTE_STAGE4_CONFIG_KEYS));
				}

				function buildRemoteSessionAppendParams(overlay) {
					const contract = buildRemoteSessionAppendContract(overlay);
					return Object.assign({}, contract.stage1, contract.stage2, contract.stage3, contract.stage4);

				function appendOptionValues(select, values, label) {
					if (!select) return;
					const current = select.value || '';
					select.innerHTML = `<option value="">${label}</option>`;
					for (const value of values.filter(Boolean).sort()) {
						const option = document.createElement('option');
						option.value = value;
						option.textContent = value;
						select.appendChild(option);
					}
					if (values.includes(current)) select.value = current;
				}

				function remoteTurnSearchText(turn) {
					return JSON.stringify(turn || {}).toLowerCase();
				}

				function formatRemoteValue(value) {
					if (value === undefined || value === null || value === '') return '';
					if (typeof value === 'string') return value;
					try {
						return JSON.stringify(value, null, 2);
					} catch {
						return String(value);
					}
				}

				function isThinkingOnlyText(value) {
					const text = normalizeText(String(value || '')).toLowerCase();
					return !text ||
						text === 'thinking process:' ||
						text === 'thinking process' ||
						text === 'thought process:' ||
						text === 'thought process';
				}

				function cleanManualAppendUserText(value) {
					const text = String(value || '');
					const marker = 'User request:';
					const index = text.lastIndexOf(marker);
					return index >= 0 ? text.slice(index + marker.length).trim() : text;
				}

				function createRemoteSection(label, value, options = {}) {
					const text = formatRemoteValue(value);
					if (!text && !options.showEmpty) return null;
					const section = document.createElement('div');
					section.style.cssText = `display:flex;flex-direction:column;gap:4px;${options.align === 'right' ? 'align-items:flex-end;' : ''}`;
					const head = document.createElement('div');
					head.textContent = label;
					head.style.cssText = 'font-size:11px;opacity:0.58;text-transform:uppercase;letter-spacing:.04em;';
					const body = document.createElement('pre');
					body.textContent = text || options.emptyText || '(empty)';
					body.style.cssText = [
						'margin:0',
						'max-width:100%',
						'white-space:pre-wrap',
						'word-break:break-word',
						'border-radius:12px',
						`background:${options.background || 'rgba(255,255,255,0.08)'}`,
						`padding:${options.compact ? '7px 9px' : '10px 12px'}`,
						'font:inherit',
						'font-size:13px',
						'line-height:1.45'
					].join(';');
					section.appendChild(head);
					section.appendChild(body);
					return section;
				}

				function structuredRemoteTurnResult(turn) {
					return {
						direct_answer: isThinkingOnlyText(turn.direct_answer) ? '' : (turn.direct_answer || ''),
						summary: turn.summary || '',
						evidence: turn.evidence || [],
						next_action: turn.next_action || '',
						confidence: turn.confidence || '',
						authorization_default: turn.authorization_default || '',
						auto_authorize: typeof turn.auto_authorize === 'boolean' ? turn.auto_authorize : '',
						primary_intent: turn.primary_intent || '',
						result_ref: turn.result_ref || '',
						evidence_ref: turn.evidence_ref || '',
						task_id: turn.task_id || '',
						task_group_id: turn.task_group_id || '',
						timings: turn.timings || {},
						context_refs: turn.context_refs || [],
						config_source: turn.config_source || '',
						model: turn.model || '',
						reasoning_level: turn.reasoning_level || ''
					};
				}

				function renderRemoteSessionTurns(overlay, session) {
					const turnsHost = overlay.querySelector('.codex-remote-session-turns');
					const title = overlay.querySelector('.codex-remote-session-title');
					const meta = overlay.querySelector('.codex-remote-session-meta');
					const turns = Array.isArray(session?.turns) ? session.turns : [];
					overlay.codexRemoteSessionData = session;
					if (title) title.textContent = session?.title || `Remote session ${String(session?.session_id || '').slice(0, 8)}`;
					if (meta) {
						meta.textContent = [
							session?.session_id ? `session ${session.session_id}` : '',
							turns.length ? `${turns.length} turns` : '0 turns',
							session?.updated_at ? `updated ${new Date(Number(session.updated_at)).toLocaleString()}` : ''
						].filter(Boolean).join(' | ');
					}
					if (!turnsHost) return;
					turnsHost.innerHTML = '';
					appendOptionValues(overlay.querySelector('.codex-remote-session-filter-purpose'), [...new Set(turns.map((turn) => turn.prompt_purpose || ''))], 'All purposes');
					appendOptionValues(overlay.querySelector('.codex-remote-session-filter-confidence'), [...new Set(turns.map((turn) => turn.confidence || ''))], 'All confidence');

					const confidenceFilter = overlay.querySelector('.codex-remote-session-filter-confidence')?.value || '';

						const summaryAnswer = isThinkingOnlyText(turn.summary) ? '' : (turn.summary || '');
						const assistantText = isThinkingOnlyText(rawAssistantText) ? '' : rawAssistantText;
						const info = document.createElement('div');
						info.textContent = [
							turn.turn_id || '',
							turn.write_mode || '',
							turn.prompt_purpose || '',
							turn.confidence || '',
							turn.source_type || turn.source_label || '',
							turn.authorization_default || '',

						const user = createRemoteSection('用户问题', userText, { align: 'right', background: 'rgba(255,255,255,0.16)', showEmpty: true, emptyText: '(empty user text)' });
						const assistant = createRemoteSection('助手回答', assistantText || directAnswer || summaryAnswer || '', { background: 'rgba(255,255,255,0.08)', showEmpty: true, emptyText: '未生成最终回答；请查看 Full turn JSON 或重新追加更明确的问题。' });
						const structured = createRemoteSection('结构化结果', structuredRemoteTurnResult(turn), { background: 'rgba(40,120,90,0.18)' });
						const raw = document.createElement('details');
						raw.style.cssText = 'font-size:12px;opacity:0.9;';
						const rawSummary = document.createElement('summary');
						rawSummary.textContent = 'Full turn JSON';
						rawSummary.style.cssText = 'cursor:pointer;opacity:0.78;';
						const rawBody = document.createElement('pre');
						rawBody.textContent = JSON.stringify(turn, null, 2);
						rawBody.style.cssText = 'white-space:pre-wrap;word-break:break-word;border-radius:10px;background:rgba(255,255,255,0.06);padding:10px;max-height:280px;overflow:auto;';

				function remoteConversationId(sessionId) {
					return `remote-session-${sessionId}`;

				async function openRemoteConversation(conversationId) {
					if (!conversationId) return;
					try {
						sessionStorage.setItem('codexPendingRemoteConversationId', conversationId);
					} catch {}
					try {
						if (window.codexConversationBridge?.open) {
							const result = await window.codexConversationBridge.open(conversationId);
							if (result?.opened) return;
						}
					} catch (error) {
						console.warn('[codex remote sessions] bridge open failed:', error);
					}
					const targetHash = `#/chat/${conversationId}`;
					const targetUrl = `${window.location.pathname}${targetHash}`;
					if (window.location.hash !== targetHash) {
						window.location.href = targetUrl;
						return;
					}
					window.location.reload();
				}

				async function getConversationBySessionId(sessionId) {
					if (!sessionId) return null;
					const db = await openCodexAuditDb();
					try {
						const tx = db.transaction(['conversations'], 'readonly');
						const store = tx.objectStore('conversations');
						const index = store.index('sessionId');
						return await idbRequest(index.get(sessionId));
					} catch {
						return null;
					} finally {
						db.close();
					}
				}

				function buildRemoteConversationName(session) {
					const turns = session.turns || [];
					const lastTurn = turns[turns.length - 1] || {};

				async function deleteMessagesByConversationId(conversationId) {
					const db = await openCodexAuditDb();
					try {
						const tx = db.transaction(['messages'], 'readwrite');
						const store = tx.objectStore('messages');
						const keys = await idbRequest(store.index('convId').getAllKeys(conversationId));
						for (const key of keys || []) {
							store.delete(key);
						}
						await new Promise((resolve, reject) => {
							tx.onerror = () => reject(tx.error);
							tx.oncomplete = () => resolve();
						});
					} finally {
						db.close();
					}
				}

				async function mirrorRemoteSessionToAuditDb(session) {
					if (!session || !session.session_id) return null;
					const existingConversation = await getConversationBySessionId(session.session_id).catch(() => null);
					const conversationId = existingConversation?.id || (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : remoteConversationId(session.session_id));
					const rootId = `${conversationId}:root`;
					const turns = Array.isArray(session.turns) ? session.turns : [];
					const lastTurn = turns[turns.length - 1] || {};

					await deleteMessagesByConversationId(conversationId);

					const db = await openCodexAuditDb();
					try {
						const tx = db.transaction(['conversations', 'messages'], 'readwrite');
						const convStore = tx.objectStore('conversations');
						const msgStore = tx.objectStore('messages');

						const messages = [];
						const rootChildren = [];
						let previousMessageId = rootId;
						let currNode = rootId;

						messages.push({
							id: rootId,
							convId: conversationId,
							sessionId: session.session_id,
							type: 'root',
							timestamp: session.created_at || session.updated_at || Date.now(),
							role: 'system',
							content: '',
							parent: null,
							toolCalls: '',
							children: []
						});

						for (const turn of turns) {
							const turnId = turn.turn_id || `turn-${Date.now()}`;
							const userId = `${conversationId}:user:${turnId}`;
							const assistantId = `${conversationId}:assistant:${turnId}`;
							const taskId = turn.task_id || undefined;
							const evidenceRefs = turn.evidence_ref ? [turn.evidence_ref] : [];
							const assistantText = turn.assistant_text || turn.direct_answer || '';
							const userText = turn.user_text || turn.prompt || '';
							const turnTime = Number(turn.timestamp || session.updated_at || Date.now());
							const previousMessage = messages.find((message) => message.id === previousMessageId);
							if (previousMessage) {
								previousMessage.children = [userId];
							}
							if (previousMessageId === rootId) {
								rootChildren.push(userId);
							}

							messages.push({
								id: userId,
								convId: conversationId,
								sessionId: session.session_id,
								turnId,
								taskId,
								taskGroupId: turn.task_group_id || undefined,
								intentKey: turn.prompt_purpose || undefined,
								evidenceRefs,
								sourceType: turn.source_type || undefined,
								sourceLabel: turn.source_label || undefined,
								sourceDetail: turn.source_detail || undefined,
								handoffFrom: turn.handoff_from || undefined,
								handoffTo: turn.handoff_to || undefined,
								takeoverRelation: turn.takeover_relation || undefined,
								type: 'text',
								timestamp: turnTime,
								role: 'user',
								content: userText,
								parent: previousMessageId,
								toolCalls: '',
								children: normalizeText(assistantText) ? [assistantId] : [],
								dialogSlice: {
									sessionId: session.session_id,
									turnId,
									userText,
									assistantText,
									summary: turn.summary || undefined,
									expressionKeys: [],
									evidenceRefs,
									createdAt: turnTime
								},
								executionBinding: {
									sessionId: session.session_id,
									turnId,
									primaryIntent: turn.prompt_purpose || undefined,
									taskId,
									taskGroupId: turn.task_group_id || undefined,
									sourceType: turn.source_type || undefined,
									sourceLabel: turn.source_label || undefined,
									sourceDetail: turn.source_detail || undefined,
									handoffFrom: turn.handoff_from || undefined,
									handoffTo: turn.handoff_to || undefined,
									takeoverRelation: turn.takeover_relation || undefined,
									evidenceRefs,
									status: turn.confidence,
									toolName: turn.prompt_purpose || undefined
								}
							});

							previousMessageId = userId;
							currNode = userId;

							if (normalizeText(assistantText)) {
								messages.push({
									id: assistantId,
									convId: conversationId,
									sessionId: session.session_id,
									turnId,
									taskId,
									taskGroupId: turn.task_group_id || undefined,
									intentKey: turn.prompt_purpose || undefined,
									evidenceRefs,
									sourceType: turn.source_type || undefined,
									sourceLabel: turn.source_label || undefined,
									sourceDetail: turn.source_detail || undefined,
									handoffFrom: turn.handoff_from || undefined,
									handoffTo: turn.handoff_to || undefined,
									takeoverRelation: turn.takeover_relation || undefined,
									type: 'text',
									timestamp: turnTime + 1,
									role: 'assistant',
									content: assistantText,
									parent: userId,
									toolCalls: '',
									children: [],
									structuredConclusion: {
										task_state: '',
										reasoning_level: turn.reasoning_level || undefined,
										primary_intent: turn.prompt_purpose || undefined,
										evidence_refs: evidenceRefs,
										next_action: turn.next_action || undefined,
										session_id: session.session_id,
										turn_id: turnId,
										summary: turn.summary || turn.direct_answer || undefined
									},
									dialogSlice: {
										sessionId: session.session_id,
										turnId,
										userText,
										assistantText,
										summary: turn.summary || undefined,
										expressionKeys: [],
										evidenceRefs,
										createdAt: turnTime + 1
									},
									executionBinding: {
										sessionId: session.session_id,
										turnId,
										primaryIntent: turn.prompt_purpose || undefined,
										taskId,
										taskGroupId: turn.task_group_id || undefined,
										sourceType: turn.source_type || undefined,
										sourceLabel: turn.source_label || undefined,
										sourceDetail: turn.source_detail || undefined,
										handoffFrom: turn.handoff_from || undefined,
										handoffTo: turn.handoff_to || undefined,
										takeoverRelation: turn.takeover_relation || undefined,
										evidenceRefs,
										status: turn.confidence,
										toolName: turn.prompt_purpose || undefined
									}
								});
								currNode = assistantId;
								previousMessageId = assistantId;
							}
						}

						messages[0].children = rootChildren;
						for (const message of messages) {
							msgStore.put(message);
						}

						convStore.put({
							id: conversationId,
							name: buildRemoteConversationName(session),
							lastModified: session.updated_at || Date.now(),
							currNode: currNode === rootId ? '' : currNode,
							sessionId: session.session_id,
							lastTurnId: session.last_turn_id || lastTurn.turn_id,
							currentTaskState: lastTurn ? (lastTurn.write_mode === 'append' ? 'verify' : 'observe') : undefined,
							currentReasoningLevel: lastTurn.reasoning_level || undefined,
							currentPrimaryIntent: lastTurn.prompt_purpose || undefined,
							currentSummary: lastTurn.summary || lastTurn.direct_answer || undefined,
							lastTaskId: lastTurn.task_id || undefined,
							currentTaskGroupId: session.task_group_id || lastTurn.task_group_id || undefined,
							lastEvidenceRefs: lastTurn.evidence_ref ? [lastTurn.evidence_ref] : [],
							currentExpressionKeys: [],
							currentSourceType: session.source_type || lastTurn.source_type || undefined,
							currentSourceLabel: lastTurn.source_label || session.source_type || undefined,
							currentSourceDetail: lastTurn.source_detail || undefined,
							currentHandoffFrom: session.handoff_from || lastTurn.handoff_from || undefined,
							currentHandoffTo: session.handoff_to || lastTurn.handoff_to || undefined,
							currentTakeoverRelation: session.takeover_relation || lastTurn.takeover_relation || undefined
						});

						await new Promise((resolve, reject) => {
							tx.onerror = () => reject(tx.error);
							tx.oncomplete = () => resolve();
						});
						return conversationId;
					} finally {
						db.close();
					}
				}

				async function syncRemoteSessionsToAuditDb(limit = 20) {
					const remoteSessions = await fetchRemoteSessions(limit);
					for (const item of remoteSessions) {
						const sessionId = item.session_id || item.sessionId;
						if (!sessionId) continue;
						const full = item.turns ? item : await fetchRemoteSession(sessionId);
						if (full && full.session_id) {
							await mirrorRemoteSessionToAuditDb(full);
						}
					}
				}

				function extractResultLabel(value) {
					const text = normalizeText(value);
					if (!text) return '';
					if (/\b(PASS|SUCCESS|SUCCEEDED)\b|通过|成功/.test(text)) return 'PASS';
					if (/\b(FAIL|FAILED|ERROR)\b|失败|错误/.test(text)) return 'FAIL';
					if (/\bBLOCKED\b|阻塞/.test(text)) return 'BLOCKED';
					if (/\bOK\b|正常|可用|就绪/.test(text)) return 'OK';
					return '';
				}

				function extractDisplaySummary(value) {
					const lines = String(value || '')
						.split(/\r?\n/)
						.map((line) => line.replace(/^[>\-\*\u2022]+\s*/, '').replace(/^\d+\.\s*/, '').trim())
						.filter(Boolean)
						.filter((line) => !/^```/.test(line))
						.filter((line) => !/^state\s+/i.test(line));
					const preferred =
						lines.find((line) => /\b(PASS|FAIL|FAILED|BLOCKED|OK|SUCCESS|ERROR)\b|通过|成功|失败|错误|正常|建议/.test(line)) ||
						lines.find((line) => line.length >= 8) ||
						lines[0] ||
						'';
					const compact = normalizeText(
						preferred
							.replace(/\b(PASS|FAIL|FAILED|BLOCKED|OK|SUCCESS|ERROR)\b[: ]*/gi, '')
							.replace(/^(整体状态|操作结果|总结状态|总结|摘要)[:：]\s*/i, '')
					);
					return compact.length > 46 ? `${compact.slice(0, 46)}...` : compact;
				}

				function buildConversationMeta(conversation, latestAssistantMessage) {
					const structuredConclusion = latestAssistantMessage?.structuredConclusion || {};
					const sourceSummary =
						structuredConclusion.summary ||
						conversation.currentSummary ||
						latestAssistantMessage?.content ||
						'';
					const resultLabel = extractResultLabel(sourceSummary);
					const sourceLabel = conversation.currentSourceLabel || conversation.currentSourceType || '';
					const taskState = structuredConclusion.task_state || conversation.currentTaskState || '';
					const primaryIntent =
						(structuredConclusion.primary_intent &&
						 structuredConclusion.primary_intent !== 'unresolved'
							? structuredConclusion.primary_intent
							: conversation.currentPrimaryIntent && conversation.currentPrimaryIntent !== 'unresolved'
								? conversation.currentPrimaryIntent
								: '') || '';
					const taskId = latestAssistantMessage?.taskId || conversation.lastTaskId || '';
					const taskGroupId = conversation.currentTaskGroupId || latestAssistantMessage?.taskGroupId || '';
					const takeoverRelation = conversation.currentTakeoverRelation || latestAssistantMessage?.takeoverRelation || '';
					const handoffText = [conversation.currentHandoffFrom, conversation.currentHandoffTo].filter(Boolean).join('→');
					const sessionLabel = conversation.sessionId ? `session ${conversation.sessionId.slice(0, 8)}` : '';
					const summary = extractDisplaySummary(sourceSummary);
					return [
						resultLabel,
						sourceLabel,
						taskState,
						primaryIntent,
						takeoverRelation,
						taskGroupId,
						handoffText,
						taskId,
						sessionLabel,
						summary
					].filter(Boolean).join(' | ');
				}

				function normalizeText(value) {
					return (value || '').replace(/\s+/g, ' ').trim();
				}

				async function listAuditConversations() {
					const conversations = await readStoreAll('conversations');
					return conversations.sort((a, b) => (b.lastModified || 0) - (a.lastModified || 0));
				}

				async function listAuditMessages() {
					const messages = await readStoreAll('messages');
					return messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
				}

				async function getConversationBySessionId(sessionId) {
					const conversations = await listAuditConversations();
					return conversations.find((conversation) => conversation.sessionId === sessionId) || null;
				}

				async function getMessagesBySessionId(sessionId) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.sessionId === sessionId);
				}

				async function getMessagesByTaskId(taskId) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.taskId === taskId);
				}

				async function getMessagesByIntentKey(intentKey) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.intentKey === intentKey);
				}

				async function getMessagesByConversationId(conversationId) {
					const messages = await listAuditMessages();
					return messages.filter((message) => message.convId === conversationId);
				}

				async function summarizeSession(sessionId) {
					const conversation = await getConversationBySessionId(sessionId);
					const messages = await getMessagesBySessionId(sessionId);
					if (!conversation) return null;
					return {
						sessionId,
						conversationId: conversation.id,
						name: conversation.name,
						taskState: conversation.currentTaskState || '',
						reasoningLevel: conversation.currentReasoningLevel || '',
						primaryIntent: conversation.currentPrimaryIntent || '',
						summary: conversation.currentSummary || '',
						lastTaskId: conversation.lastTaskId || '',
						lastEvidenceRefs: conversation.lastEvidenceRefs || [],
						messageCount: messages.length
					};
				}

				function getActiveConversationIdFromHash() {
					const match = window.location.hash.match(/^#\/chat\/([^/?#]+)/);
					return match ? match[1] : '';
				}

				async function summarizeActiveConversation() {
					const conversationId = getActiveConversationIdFromHash();
					if (!conversationId) return null;
					const conversations = await listAuditConversations();
					const conversation = conversations.find((item) => item.id === conversationId);
					if (!conversation) return null;
					const messages = await getMessagesByConversationId(conversationId);
					return {
						conversationId: conversation.id,
						sessionId: conversation.sessionId || '',
						name: conversation.name || '',
						taskState: conversation.currentTaskState || '',
						reasoningLevel: conversation.currentReasoningLevel || '',
						primaryIntent: conversation.currentPrimaryIntent || '',
						lastTaskId: conversation.lastTaskId || '',
						lastEvidenceRefs: conversation.lastEvidenceRefs || [],
						currentSummary: conversation.currentSummary || '',
						messageCount: messages.length
					};
				}

				async function renderAuditSummaryPanel() {
					const panel = ensureAuditSummaryPanel();
					if (!panel || !panel.parentElement) return;
					const summary = await summarizeActiveConversation();
					if (!summary) {
						panel.textContent = 'Audit summary: no active conversation binding detected yet.';
						return;
					}
					panel.textContent = [
						'Audit summary',
						`session: ${summary.sessionId || '(empty)'}`,
						`task_state: ${summary.taskState || '(empty)'}`,
						`reasoning: ${summary.reasoningLevel || '(empty)'}`,
						`intent: ${summary.primaryIntent || '(empty)'}`,
						`task_id: ${summary.lastTaskId || '(empty)'}`,
						`messages: ${summary.messageCount}`,
						`summary: ${summary.currentSummary || '(empty)'}`
					].join('\n');
				}

				function buildMessageAuditText(message) {
					const structuredConclusion = message.structuredConclusion || {};
					const parts = [
						`session ${message.sessionId || structuredConclusion.session_id || '(empty)'}`,
						`turn ${message.turnId || structuredConclusion.turn_id || '(empty)'}`,
						`intent ${message.intentKey || structuredConclusion.primary_intent || '(empty)'}`,
						`task ${message.taskId || '(empty)'}`
					];
					return parts.join(' | ');
				}

				function buildConversationAuditText(summary) {
					if (!summary) return 'session (pending) | turn (pending) | intent (pending) | task (pending)';
					return [
						`session ${summary.sessionId || '(empty)'}`,
						'turn (latest)',
						`intent ${summary.primaryIntent || '(empty)'}`,
						`task ${summary.lastTaskId || '(empty)'}`
					].join(' | ');
				}

				function findMessageStatisticsRows() {
					return Array.from(document.querySelectorAll('div')).filter((node) => {
						const text = normalizeText(node.textContent || '');
						if (!text) return false;
						const hasTokenStat = /\b\d+\s+tokens\b/i.test(text);
						const hasTimeStat = /\b\d+(\.\d+)?s\b/.test(text);
						const hasRateStat = /\b\d+(\.\d+)?\s*\/s\b/i.test(text);
						const isPendingAuditLine = text.includes('session (pending)') || text.includes('turn (pending)');
						const isAuditLine = node.classList?.contains('codex-audit-message-line');
						return !isPendingAuditLine && !isAuditLine && hasTokenStat && (hasTimeStat || hasRateStat);
					});
				}

				function ensureMessageAuditChip(row) {
					let chip = row.querySelector('.codex-audit-message-chip');
					if (!chip) {
						const previous = row.previousElementSibling;
						if (previous && previous.classList?.contains('codex-audit-message-chip')) {
							chip = previous;
						}
					}
					if (!chip) {
						chip = document.createElement('span');
						chip.className = 'codex-audit-message-chip';
						chip.style.cssText = [
							'display: inline-flex',
							'align-items: center',
							'margin-left: 12px',
							'padding: 2px 8px',
							'border: 1px solid rgba(255,255,255,0.12)',
							'border-radius: 999px',
							'font-size: 11px',
							'line-height: 1.2',
							'color: rgba(255,255,255,0.7)',
							'background: rgba(255,255,255,0.04)',
							'white-space: nowrap'
						].join(';');
						row.insertAdjacentElement('afterbegin', chip);
					} else if (chip.parentElement !== row) {
						row.insertAdjacentElement('afterbegin', chip);
					} else if (row.firstElementChild !== chip) {
						row.insertAdjacentElement('afterbegin', chip);
					}
					return chip;
				}

				function cleanupMessageAuditChips(statRows) {
					const validRows = new Set(statRows);
					Array.from(document.querySelectorAll('.codex-audit-message-chip')).forEach((chip) => {
						const parent = chip.parentElement;
						if (!parent || !validRows.has(parent)) {
							chip.remove();
						}
					});
				}

				async function decorateMessageStatistics() {
					const conversationId = getActiveConversationIdFromHash();
					if (!conversationId) return;
					const statRows = findMessageStatisticsRows();
					if (!statRows.length) return;
					cleanupMessageAuditChips(statRows);
					const allMessages = await getMessagesByConversationId(conversationId);
					const assistantMessages = allMessages
						.filter((message) => message.role === 'assistant' && message.type !== 'root')
						.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
					const conversationSummary = await summarizeActiveConversation();
					const row = statRows[statRows.length - 1];
					if (!row) return;
					const lastAssistantMessage = assistantMessages[assistantMessages.length - 1];
					const auditChip = ensureMessageAuditChip(row);
					if (!auditChip) return;
					auditChip.textContent = lastAssistantMessage
						? buildMessageAuditText(lastAssistantMessage)
						: buildConversationAuditText(conversationSummary);
				}

				function findSidebarConversationButtons() {
					const sidebarTextNodes = Array.from(document.querySelectorAll('*')).filter((node) => {
						return normalizeText(node.textContent || '') === 'Conversations';
					});
					const sidebarLabel = sidebarTextNodes[0];
					if (!sidebarLabel) return [];
					let container = sidebarLabel.parentElement;
					for (let i = 0; i < 6 && container; i += 1) {
						const buttons = Array.from(container.querySelectorAll('button')).filter((button) => {
							const text = normalizeText(button.innerText || button.textContent || '');
							return !!text && text !== 'New chat' && text !== 'Search' && !text.includes('MCP Servers');
						});
						if (buttons.length >= 1) return buttons;
						container = container.parentElement;
					}
					return [];
				}

				function findSidebarConversationContainer() {
					const buttons = findSidebarConversationButtons();
					if (!buttons.length) return null;
					return buttons[0].parentElement;
				}

				function ensureRemoteConversationListContainer() {
					let container = document.getElementById('codex-remote-conversation-list');
					if (container) return container;
					const sidebarLabel = Array.from(document.querySelectorAll('*')).find((node) => {
						return normalizeText(node.textContent || '') === 'Conversations';
					});
					if (!sidebarLabel || !sidebarLabel.parentElement) return null;
					const headingRow = sidebarLabel.parentElement;
					const sectionHost = headingRow.parentElement;
					if (!sectionHost) return null;
					const section = document.createElement('div');
					section.id = 'codex-remote-conversation-list';
					section.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin:8px 0 12px 0;';
					const heading = document.createElement('div');
					heading.textContent = 'Remote Sessions';
					heading.className = 'codex-remote-conversation-heading';
					heading.style.cssText = 'font-size:12px;line-height:1.2;opacity:0.72;padding:0 12px 0 12px;';
					const list = document.createElement('div');
					list.className = 'codex-remote-conversation-items';
					list.style.cssText = 'display:flex;flex-direction:column;gap:6px;padding:0 8px;';
					section.appendChild(heading);
					section.appendChild(list);
					sectionHost.insertBefore(section, headingRow);
					return section;
				}

				function createRemoteConversationButton(conversation, latestAssistantMessage) {
					const button = document.createElement('div');
					button.className = 'codex-remote-conversation-button';
					button.dataset.sessionId = conversation.sessionId || '';
					button.style.cssText = [
						'display:flex',
						'flex-direction:column',
						'gap:4px',
						'width:100%',
						'padding:10px 12px',
						'border-radius:12px',
						'background:rgba(255,255,255,0.05)',
						'color:inherit',
						'text-align:left'
					].join(';');
					const content = document.createElement('div');
					content.className = 'codex-remote-conversation-content';
					content.style.cssText = 'display:flex;flex-direction:column;gap:4px;cursor:pointer;';
					const title = document.createElement('div');
					title.textContent = conversation.name || `Remote session ${String(conversation.sessionId || '').slice(0, 8)}`;
					title.style.cssText = 'font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;';
					const meta = document.createElement('div');
					meta.className = 'codex-remote-conversation-meta';
					meta.textContent = buildConversationMeta(conversation, latestAssistantMessage);
					meta.style.cssText = 'font-size:12px;line-height:1.2;opacity:0.78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;';
					content.appendChild(title);
					content.appendChild(meta);
					const actions = document.createElement('div');
					actions.style.cssText = 'display:flex;justify-content:flex-end;';
					const openButton = document.createElement('button');
					openButton.type = 'button';
					openButton.className = 'codex-remote-open-button';
					openButton.textContent = 'View';
					openButton.disabled = false;
					openButton.style.cssText = 'font-size:11px;line-height:1;padding:4px 8px;border:none;border-radius:999px;background:rgba(255,255,255,0.1);color:inherit;opacity:1;cursor:pointer;';
					actions.appendChild(openButton);
					button.appendChild(content);
					button.appendChild(actions);
					button.title = [meta.textContent, conversation.currentSummary, latestAssistantMessage?.taskId].filter(Boolean).join(' | ');
					return button;
				}

				function setRemoteConversationButtonReady(button, conversationId, isReady) {
					if (!button) return;
					const openButton = button.querySelector('.codex-remote-open-button');
					if (isReady) {
						button.dataset.readyConversationId = conversationId || '';
						button.dataset.openState = 'ready';
						button.style.outline = '1px solid rgba(255,255,255,0.16)';
						if (openButton) {
							openButton.disabled = false;
							openButton.textContent = 'Open';
							openButton.style.opacity = '1';
							openButton.style.cursor = 'pointer';
						}
					} else {
						delete button.dataset.readyConversationId;
						button.dataset.openState = 'loading';
						button.style.outline = 'none';
						if (openButton) {
							openButton.disabled = true;
							openButton.textContent = 'Sync first';
							openButton.style.opacity = '0.6';
							openButton.style.cursor = 'not-allowed';
						}
					}
				}

				function buildRemoteConversationMetaFromListItem(item) {
					const resultLabel = extractResultLabel(item.current_summary || '');
					const sourceLabel = item.source_type || '';
					const taskGroup = item.task_group_id || '';
					const taskId = item.last_task_id || '';
					const sessionLabel = item.session_id ? `session ${String(item.session_id).slice(0, 8)}` : '';
					const summary = extractDisplaySummary(item.current_summary || '');
					return [resultLabel, sourceLabel, taskGroup, taskId, sessionLabel, summary].filter(Boolean).join(' | ');
				}

				function buildRemoteConversationViewFromListItem(item) {
					return {
						id: remoteConversationId(item.session_id || ''),
						name: buildRemoteConversationNameFromListItem(item),
						sessionId: item.session_id || '',
						currentSummary: item.current_summary || '',
						lastTaskId: item.last_task_id || '',
						currentTaskGroupId: item.task_group_id || '',
						currentSourceType: item.source_type || ''
					};
				}

				function updateRemoteConversationButton(button, conversation, latestAssistantMessage) {
					button.dataset.sessionId = conversation.sessionId || '';
					const title = button.firstElementChild;
					const meta = button.children[1];
					const nextTitle = conversation.name || `Remote session ${String(conversation.sessionId || '').slice(0, 8)}`;
					const nextMeta = buildConversationMeta(conversation, latestAssistantMessage);
					if (title && normalizeText(title.textContent) !== normalizeText(nextTitle)) {
						title.textContent = nextTitle;
					}
					if (meta && normalizeText(meta.textContent) !== normalizeText(nextMeta)) {
						meta.textContent = nextMeta;
					}
					button.title = [nextMeta, conversation.currentSummary, latestAssistantMessage?.taskId].filter(Boolean).join(' | ');
				}

				function buildRemoteConversationView(session) {
					const turns = Array.isArray(session.turns) ? session.turns : [];
					const lastTurn = turns[turns.length - 1] || {};
					const latestAssistantMessage = normalizeText(lastTurn.assistant_text || lastTurn.direct_answer)
						? {
							content: lastTurn.assistant_text || lastTurn.direct_answer || '',
							taskId: lastTurn.task_id || '',
							structuredConclusion: {
								task_state: lastTurn.write_mode === 'append' ? 'verify' : 'observe',
								primary_intent: lastTurn.prompt_purpose || '',
								summary: lastTurn.summary || lastTurn.direct_answer || ''
							}
						}
						: null;
					return {
						id: remoteConversationId(session.session_id),
						name: buildRemoteConversationName(session),
						sessionId: session.session_id,
						currentTaskState: lastTurn.write_mode === 'append' ? 'verify' : 'observe',
						currentPrimaryIntent: lastTurn.prompt_purpose || '',
						currentSummary: lastTurn.summary || lastTurn.direct_answer || '',
						lastTaskId: lastTurn.task_id || '',
						currentTaskGroupId: session.task_group_id || lastTurn.task_group_id || '',
						currentSourceType: session.source_type || lastTurn.source_type || '',
						currentSourceLabel: lastTurn.source_label || session.source_type || '',
						currentHandoffFrom: session.handoff_from || lastTurn.handoff_from || '',
						currentHandoffTo: session.handoff_to || lastTurn.handoff_to || '',
						currentTakeoverRelation: session.takeover_relation || lastTurn.takeover_relation || ''
					};
				}

				async function decorateSidebarConversationList() {
					const conversations = await listAuditConversations();
					if (!conversations.length) return;
					const allMessages = await listAuditMessages();
					const buttons = findSidebarConversationButtons();
					if (!buttons.length) return;
					const visibleConversations = conversations.slice(0, buttons.length);
					for (let index = 0; index < visibleConversations.length; index += 1) {
						const conversation = visibleConversations[index];
						const button = buttons[index];
						if (!button) continue;
						const span = button.querySelector('span');
						if (!span) continue;
						const latestAssistantMessage = allMessages
							.filter((message) => message.convId === conversation.id && message.role === 'assistant' && message.type !== 'root')
							.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))[0];
						const meta = buildConversationMeta(conversation, latestAssistantMessage);
						const nextText = meta ? `${conversation.name}\n${meta}` : conversation.name;
						if (normalizeText(span.textContent) !== normalizeText(nextText)) {
							span.textContent = nextText;
						}
						button.title = [
							meta,
							conversation.currentSummary,
							latestAssistantMessage?.taskId
						].filter(Boolean).join(' | ') || conversation.name;
						button.setAttribute(CODEX_AUDIT_SIDEBAR_MARK, 'true');
					}
				}

				async function renderRemoteConversationList() {
					const section = ensureRemoteConversationListContainer();
					if (!section) return;
					const container = section.querySelector('.codex-remote-conversation-items');
					const heading = section.querySelector('.codex-remote-conversation-heading');
					if (!container) return;
					let remoteSessions = await fetchRemoteSessions(20);
					if (!remoteSessions.length && codexRemoteSessionsLastItems.length && (Date.now() - codexRemoteSessionsLastItemsAt) < 60000) {
						remoteSessions = codexRemoteSessionsLastItems;
					}
					const validSessionIds = new Set();
					if (heading) {
						heading.textContent = remoteSessions.length ? `Remote Sessions (${remoteSessions.length})` : 'Remote Sessions';
					}
					if (!remoteSessions.length) {
						Array.from(container.querySelectorAll('.codex-remote-conversation-button')).forEach((button) => button.remove());
						return;
					}
					for (const item of remoteSessions) {
						const sessionId = item.session_id || item.sessionId;
						if (!sessionId) continue;
						validSessionIds.add(sessionId);
						const conversation = buildRemoteConversationViewFromListItem(item);
						const latestAssistantMessage = normalizeText(item.current_summary || '')
							? {
								content: item.current_summary || '',
								taskId: item.last_task_id || '',
								structuredConclusion: {
									summary: item.current_summary || ''
								}
							}
							: null;
						let button = container.querySelector(`.codex-remote-conversation-button[data-session-id="${sessionId}"]`);
						if (!button) {
							button = createRemoteConversationButton(conversation, latestAssistantMessage);
							const content = button.querySelector('.codex-remote-conversation-content');
							const openButton = button.querySelector('.codex-remote-open-button');
							content?.addEventListener('click', async (event) => {
								event.preventDefault();
								event.stopPropagation();
								loadRemoteSessionModal(sessionId).catch((error) => console.warn('[codex remote sessions] modal open failed:', error));
							});
							openButton?.addEventListener('click', (event) => {
								event.preventDefault();
								event.stopPropagation();
								loadRemoteSessionModal(sessionId).catch((error) => console.warn('[codex remote sessions] modal open failed:', error));
							});
							container.appendChild(button);
						} else {
							const title = button.querySelector('.codex-remote-conversation-content > div:first-child');
							const meta = button.querySelector('.codex-remote-conversation-meta');
							const nextTitle = conversation.name || `Remote session ${String(conversation.sessionId || '').slice(0, 8)}`;
							const nextMeta = buildRemoteConversationMetaFromListItem(item);
							if (title && normalizeText(title.textContent) !== normalizeText(nextTitle)) {
								title.textContent = nextTitle;
							}
							if (meta && normalizeText(meta.textContent) !== normalizeText(nextMeta)) {
								meta.textContent = nextMeta;
							}
							button.title = [nextMeta, conversation.currentSummary, latestAssistantMessage?.taskId].filter(Boolean).join(' | ');
						}
					}
					Array.from(container.querySelectorAll('.codex-remote-conversation-button')).forEach((button) => {
						if (!validSessionIds.has(button.dataset.sessionId || '')) {
							button.remove();
						}
					});
				}

				function installAuditSidebarObserver() {
					const scheduleDecorate = () => {
						if (codexRemoteSessionsRenderQueued) return;
						codexRemoteSessionsRenderQueued = true;
						window.requestAnimationFrame(async () => {
							codexRemoteSessionsRenderQueued = false;
							decorateSidebarConversationList().catch(() => {});
							renderRemoteConversationList().catch(() => {});
							renderAuditSummaryPanel().catch(() => {});
							decorateMessageStatistics().catch(() => {});
						});
					};
					scheduleDecorate();
					setTimeout(scheduleDecorate, 300);
					setTimeout(scheduleDecorate, 1200);
					setTimeout(scheduleDecorate, 2500);
					let bootstrapTicks = 0;
					const bootstrapTimer = setInterval(() => {
						bootstrapTicks += 1;
						scheduleDecorate();
						const section = document.getElementById('codex-remote-conversation-list');
						const buttons = section ? section.querySelectorAll('.codex-remote-conversation-button') : [];
						if (buttons.length > 0 || bootstrapTicks >= 8) {
							clearInterval(bootstrapTimer);
						}
					}, 800);
					window.addEventListener('hashchange', scheduleDecorate);
					window.addEventListener('focus', scheduleDecorate);
					window.addEventListener('resize', scheduleDecorate);
					setInterval(scheduleDecorate, 12000);
				}

				window.codexAudit = {
					openDb: openCodexAuditDb,
					listConversations: listAuditConversations,
					listMessages: listAuditMessages,
					syncRemoteSessions: syncRemoteSessionsToAuditDb,
					getConversationBySessionId,
					getMessagesBySessionId,
					getMessagesByTaskId,
					getMessagesByIntentKey,
					getMessagesByConversationId,
					summarizeSession,
					summarizeActiveConversation,
					refreshSidebar: decorateSidebarConversationList,
					refreshMessageAudit: decorateMessageStatistics
				};

				{
					__sveltekit__ = {
						base: new URL('.', location).pathname.slice(0, -1)
					};

					const element = document.currentScript.parentElement;

					import("./bundle.js?v=20260424a").then((app) => {
						app.start(element);
						installAuditSidebarObserver();
					});
				}
			</script>
		</div>
	</body>
</html>
